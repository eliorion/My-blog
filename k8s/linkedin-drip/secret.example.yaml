apiVersion: v1
kind: Secret
metadata:
  name: linkedin-drip
  namespace: linkedin-drip
type: Opaque
stringData:
  LINKEDIN_ACCESS_TOKEN: "REPLACE_ME"
  LINKEDIN_PERSON_URN: "urn:li:person:DxKqhDF5zi"
  GITHUB_TOKEN: "REPLACE_ME"
