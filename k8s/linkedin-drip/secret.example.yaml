# Template only — do NOT commit real values. Encrypt with SOPS/age (or seal it)
# the same way the rest of the homelab secrets are handled, then apply.
#
#   LINKEDIN_ACCESS_TOKEN  member OAuth token, 60-day lifetime.
#                          Renew locally: python linkedin/publish.py auth
