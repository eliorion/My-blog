apiVersion: apps/v1
kind: Deployment
metadata:
  name: svg-render
  namespace: svg-render
  labels:
    app: svg-render
spec:
  replicas: 1
  selector:
    matchLabels:
      app: svg-render
  template:
    metadata:
      labels:
        app: svg-render
    spec:
      containers:
        - name: svg-render
          image: ghcr.io/eliorion/my-blog-svg-render:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
          # Chromium dies on the 64 MiB /dev/shm a container gets by default.
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
          resources:
            requests:
              cpu: 100m
              memory: 320Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
