[tools]
pre-commit = "latest"
python = "3.13"
hugo = "0.153.0"
uv = "latest"

[settings]
experimental = true

[hooks]
enter = "bash ./scripts/setup_project"

[tasks."linkedin:install"]
description = "Install LinkedIn engine dependencies via uv"
run = "uv sync --dev"
dir = "linkedin"

[tasks."linkedin:test"]
description = "Run LinkedIn engine tests"
run = "uv run pytest tests/ -v"
dir = "linkedin"

[tasks."linkedin:lint"]
description = "Lint + format check LinkedIn engine"
run = [
  "uv run ruff check --target-version=py313 . --exclude drafts",
  "uv run ruff format --diff --check --target-version=py313 . --exclude drafts",
]
dir = "linkedin"

[tasks."linkedin:typecheck"]
description = "Type check LinkedIn engine"
run = "uv run mypy generate.py --ignore-missing-imports"
dir = "linkedin"

[tasks."linkedin:coverage"]
description = "Run tests with HTML coverage + test report"
run = """
uv run pytest tests/ -v \
  --cov=. \
  --cov-report=html:coverage-html \
  --cov-report=term-missing \
  --cov-fail-under=79 \
  --html=test-report.html \
  --self-contained-html
"""
dir = "linkedin"

[tasks."linkedin:generate"]
description = "Generate LinkedIn drafts using claude CLI (subscription, no API key needed)"
run = "uv run python generate.py generate"
dir = "linkedin"

[tasks."linkedin:check"]
description = "Run all LinkedIn engine checks (lint + typecheck + tests)"
run = [
  "uv run ruff check --target-version=py313 . --exclude drafts",
  "uv run ruff format --diff --check --target-version=py313 . --exclude drafts",
  "uv run mypy generate.py --ignore-missing-imports",
  "uv run pytest tests/ -v",
]
dir = "linkedin"
