<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300">
  <rect width="800" height="300" fill="#ffffff"/>

  <!-- Left accent panel -->
  <rect x="0" y="0" width="280" height="300" fill="#0d2137"/>

  <!-- TPM chip -->
  <rect x="46" y="52" width="64" height="64" fill="none" stroke="#ffd43b" stroke-width="2.5" rx="8"/>
  <rect x="62" y="68" width="32" height="32" fill="none" stroke="#ffd43b" stroke-width="2" rx="4"/>
  <!-- chip pins -->
  <line x1="46" y1="66" x2="34" y2="66" stroke="#ffd43b" stroke-width="2"/>
  <line x1="46" y1="84" x2="34" y2="84" stroke="#ffd43b" stroke-width="2"/>
  <line x1="46" y1="102" x2="34" y2="102" stroke="#ffd43b" stroke-width="2"/>
  <line x1="110" y1="66" x2="122" y2="66" stroke="#ffd43b" stroke-width="2"/>
  <line x1="110" y1="84" x2="122" y2="84" stroke="#ffd43b" stroke-width="2"/>
  <line x1="110" y1="102" x2="122" y2="102" stroke="#ffd43b" stroke-width="2"/>
  <text x="78" y="136" font-family="'Courier New', Courier, monospace" font-size="11" fill="#ffd43b" text-anchor="middle">TPM2 · PCR 7</text>

  <!-- Auto-unlock arrow to NVMe -->
  <line x1="122" y1="84" x2="168" y2="84" stroke="#51cf66" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4,3"/>
  <polygon points="166,77 180,84 166,91" fill="#51cf66"/>

  <!-- NVMe (auto domain) — open padlock -->
  <rect x="184" y="60" width="66" height="46" fill="none" stroke="#51cf66" stroke-width="2.5" rx="6"/>
  <text x="217" y="80" font-family="'Courier New', Courier, monospace" font-size="10" fill="#51cf66" text-anchor="middle">wpool</text>
  <text x="217" y="96" font-family="Arial, sans-serif" font-size="9" fill="#51cf66" text-anchor="middle">auto (LUKS)</text>

  <!-- HDD (manual gate) — closed padlock -->
  <rect x="88" y="176" width="100" height="52" fill="none" stroke="#ff6b6b" stroke-width="2.5" rx="6"/>
  <text x="138" y="198" font-family="'Courier New', Courier, monospace" font-size="11" fill="#ff6b6b" text-anchor="middle">dpool</text>
  <text x="138" y="215" font-family="Arial, sans-serif" font-size="9" fill="#ff6b6b" text-anchor="middle">manual gate</text>
  <!-- closed padlock icon -->
  <rect x="196" y="192" width="26" height="22" fill="none" stroke="#ff6b6b" stroke-width="2.5" rx="4"/>
  <path d="M 201 192 v-7 a8 8 0 0 1 16 0 v7" fill="none" stroke="#ff6b6b" stroke-width="2.5"/>

  <text x="140" y="262" font-family="'Courier New', Courier, monospace" font-size="12" fill="#adb5bd" text-anchor="middle">boots alone · data waits</text>

  <!-- Panel right border -->
  <line x1="280" y1="0" x2="280" y2="300" stroke="#dee2e6" stroke-width="1"/>

  <!-- Project label -->
  <text x="312" y="42" font-family="'Courier New', Courier, monospace" font-size="13" fill="#adb5bd">garage-fleet / node-A install</text>

  <!-- Post title -->
  <text x="312" y="82" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="bold" fill="#0d2137">Unattended Disk Encryption</text>
  <text x="312" y="118" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="bold" fill="#0d2137">LUKS + TPM + Secure Boot</text>

  <!-- Tagline -->
  <text x="315" y="150" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#495057">Two thieves, two trust domains, one box</text>

  <!-- Separator -->
  <line x1="312" y1="168" x2="775" y2="168" stroke="#e9ecef" stroke-width="1.5"/>

  <!-- Concept chips row 1 -->
  <rect x="312" y="182" width="98" height="28" fill="#fff9db" rx="14" stroke="#ffd43b" stroke-width="1.5"/>
  <text x="361" y="200" font-family="Arial, sans-serif" font-size="12" fill="#e67700" text-anchor="middle">TPM2 auto-unlock</text>

  <rect x="420" y="182" width="90" height="28" fill="#fff5f5" rx="14" stroke="#ff6b6b" stroke-width="1.5"/>
  <text x="465" y="200" font-family="Arial, sans-serif" font-size="12" fill="#c92a2a" text-anchor="middle">Manual ZFS gate</text>

  <rect x="520" y="182" width="82" height="28" fill="#ebfbee" rx="14" stroke="#51cf66" stroke-width="1.5"/>
  <text x="561" y="200" font-family="Arial, sans-serif" font-size="12" fill="#2f9e44" text-anchor="middle">ZFS-on-root</text>

  <rect x="612" y="182" width="80" height="28" fill="#f8f0fc" rx="14" stroke="#cc5de8" stroke-width="1.5"/>
  <text x="652" y="200" font-family="Arial, sans-serif" font-size="12" fill="#862e9c" text-anchor="middle">lanzaboote</text>

  <!-- Concept chips row 2 -->
  <rect x="312" y="220" width="86" height="26" fill="#e7f5ff" rx="13" stroke="#4dabf7" stroke-width="1.5"/>
  <text x="355" y="237" font-family="Arial, sans-serif" font-size="12" fill="#1971c2" text-anchor="middle">Signed UKIs</text>

  <rect x="408" y="220" width="92" height="26" fill="#e6fcf5" rx="13" stroke="#20c997" stroke-width="1.5"/>
  <text x="454" y="237" font-family="Arial, sans-serif" font-size="12" fill="#0ca678" text-anchor="middle">disko layouts</text>

  <rect x="510" y="220" width="112" height="26" fill="#fff4e6" rx="13" stroke="#ff922b" stroke-width="1.5"/>
  <text x="566" y="237" font-family="Arial, sans-serif" font-size="12" fill="#d9480f" text-anchor="middle">3 brick bugs caught</text>

  <rect x="632" y="220" width="86" height="26" fill="#e7f5ff" rx="13" stroke="#74c0fc" stroke-width="1.5"/>
  <text x="675" y="237" font-family="Arial, sans-serif" font-size="12" fill="#1971c2" text-anchor="middle">fleet unlock</text>

  <!-- Bottom caption -->
  <text x="312" y="278" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#adb5bd">Powered-off theft ≠ powered-on theft · review the install path as hard as the config</text>
</svg>
