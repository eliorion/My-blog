<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300">
  <rect width="800" height="300" fill="#ffffff"/>

  <!-- Left accent panel -->
  <rect x="0" y="0" width="280" height="300" fill="#0f2027"/>

  <!-- runner-ci box (top, red — no docker) -->
  <rect x="18" y="22" width="108" height="60" fill="none" stroke="#ff6b6b" stroke-width="2.5" rx="6"/>
  <text x="72" y="44" font-family="'Courier New', Courier, monospace" font-size="10" fill="#ff6b6b" text-anchor="middle">runner-ci</text>
  <text x="72" y="58" font-family="Arial, sans-serif" font-size="9" fill="#868e96" text-anchor="middle">label: ci</text>
  <text x="72" y="72" font-family="Arial, sans-serif" font-size="9" fill="#868e96" text-anchor="middle">no Docker</text>

  <!-- runner-rotate box (middle, yellow — root) -->
  <rect x="18" y="102" width="108" height="60" fill="none" stroke="#ffd43b" stroke-width="2.5" rx="6"/>
  <text x="72" y="124" font-family="'Courier New', Courier, monospace" font-size="10" fill="#ffd43b" text-anchor="middle">runner-rotate</text>
  <text x="72" y="138" font-family="Arial, sans-serif" font-size="9" fill="#868e96" text-anchor="middle">label: rotate</text>
  <text x="72" y="152" font-family="Arial, sans-serif" font-size="9" fill="#868e96" text-anchor="middle">user: root</text>

  <!-- runner-deploy box (lower, green — restricted docker) -->
  <rect x="18" y="182" width="108" height="60" fill="none" stroke="#51cf66" stroke-width="2.5" rx="6"/>
  <text x="72" y="204" font-family="'Courier New', Courier, monospace" font-size="10" fill="#51cf66" text-anchor="middle">runner-deploy</text>
  <text x="72" y="218" font-family="Arial, sans-serif" font-size="9" fill="#868e96" text-anchor="middle">label: deploy</text>
  <text x="72" y="232" font-family="Arial, sans-serif" font-size="9" fill="#868e96" text-anchor="middle">TCP:2375 proxy</text>

  <!-- Arrow: runner-deploy → socket-proxy -->
  <line x1="126" y1="212" x2="154" y2="212" stroke="#51cf66" stroke-width="2" stroke-dasharray="3,2"/>
  <polygon points="152,207 162,212 152,217" fill="#51cf66"/>

  <!-- socket-proxy box -->
  <rect x="162" y="188" width="100" height="48" fill="none" stroke="#4dabf7" stroke-width="2.5" rx="6"/>
  <text x="212" y="208" font-family="'Courier New', Courier, monospace" font-size="9" fill="#4dabf7" text-anchor="middle">socket-proxy</text>
  <text x="212" y="222" font-family="Arial, sans-serif" font-size="8" fill="#868e96" text-anchor="middle">proxy-net</text>
  <text x="212" y="232" font-family="Arial, sans-serif" font-size="8" fill="#868e96" text-anchor="middle">internal</text>

  <!-- Arrow: proxy → dockerd -->
  <line x1="212" y1="236" x2="212" y2="260" stroke="#4dabf7" stroke-width="2" stroke-dasharray="3,2"/>
  <polygon points="207,258 212,270 217,258" fill="#4dabf7"/>

  <!-- dockerd label -->
  <text x="212" y="282" font-family="'Courier New', Courier, monospace" font-size="9" fill="#868e96" text-anchor="middle">host dockerd</text>

  <!-- /etc/sops/age mount arrow for runner-rotate -->
  <line x1="126" y1="132" x2="154" y2="132" stroke="#ffd43b" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="168" y="128" font-family="'Courier New', Courier, monospace" font-size="8" fill="#ffd43b">/etc/sops/age</text>

  <!-- Panel right border -->
  <line x1="280" y1="0" x2="280" y2="300" stroke="#dee2e6" stroke-width="1"/>

  <!-- Project label -->
  <text x="312" y="42" font-family="'Courier New', Courier, monospace" font-size="13" fill="#adb5bd">mve-itguard / series 4</text>

  <!-- Post title -->
  <text x="312" y="82" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="#0f2027">CI Runners That</text>
  <text x="312" y="116" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="#0f2027">Cannot Hurt Production</text>

  <!-- Tagline -->
  <text x="315" y="148" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#495057">Least-privilege self-hosted runners on the prod server</text>

  <!-- Separator -->
  <line x1="312" y1="166" x2="775" y2="166" stroke="#e9ecef" stroke-width="1.5"/>

  <!-- Chips row 1 -->
  <rect x="312" y="180" width="96" height="28" fill="#fff5f5" rx="14" stroke="#ff6b6b" stroke-width="1.5"/>
  <text x="360" y="198" font-family="Arial, sans-serif" font-size="12" fill="#c92a2a" text-anchor="middle">runner-ci</text>

  <rect x="418" y="180" width="108" height="28" fill="#fff9db" rx="14" stroke="#ffd43b" stroke-width="1.5"/>
  <text x="472" y="198" font-family="Arial, sans-serif" font-size="12" fill="#e67700" text-anchor="middle">runner-rotate</text>

  <rect x="536" y="180" width="112" height="28" fill="#ebfbee" rx="14" stroke="#51cf66" stroke-width="1.5"/>
  <text x="592" y="198" font-family="Arial, sans-serif" font-size="12" fill="#2f9e44" text-anchor="middle">runner-deploy</text>

  <rect x="658" y="180" width="100" height="28" fill="#e7f5ff" rx="14" stroke="#4dabf7" stroke-width="1.5"/>
  <text x="708" y="198" font-family="Arial, sans-serif" font-size="12" fill="#1971c2" text-anchor="middle">socket-proxy</text>

  <!-- Chips row 2 -->
  <rect x="312" y="218" width="102" height="26" fill="#f8f0fc" rx="13" stroke="#cc5de8" stroke-width="1.5"/>
  <text x="363" y="235" font-family="Arial, sans-serif" font-size="12" fill="#862e9c" text-anchor="middle">GitHub App JWT</text>

  <rect x="424" y="218" width="104" height="26" fill="#e7f5ff" rx="13" stroke="#74c0fc" stroke-width="1.5"/>
  <text x="476" y="235" font-family="Arial, sans-serif" font-size="12" fill="#1971c2" text-anchor="middle">no-new-privileges</text>

  <rect x="538" y="218" width="88" height="26" fill="#e6fcf5" rx="13" stroke="#20c997" stroke-width="1.5"/>
  <text x="582" y="235" font-family="Arial, sans-serif" font-size="12" fill="#0ca678" text-anchor="middle">DooD same path</text>

  <rect x="636" y="218" width="122" height="26" fill="#fff4e6" rx="13" stroke="#ff922b" stroke-width="1.5"/>
  <text x="697" y="235" font-family="Arial, sans-serif" font-size="12" fill="#d9480f" text-anchor="middle">API surface limited</text>

  <!-- Bottom caption -->
  <text x="312" y="278" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#adb5bd">One image · three roles · isolated by Compose config, not by trust</text>
</svg>
