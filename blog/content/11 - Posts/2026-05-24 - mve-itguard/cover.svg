<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300">
  <rect width="800" height="300" fill="#ffffff"/>

  <!-- Left accent panel -->
  <rect x="0" y="0" width="280" height="300" fill="#1a2744"/>

  <!-- House outline -->
  <polygon points="140,60 60,155 220,155" fill="none" stroke="#4dabf7" stroke-width="3.5" stroke-linejoin="round"/>
  <rect x="170" y="82" width="18" height="38" fill="none" stroke="#4dabf7" stroke-width="2.5"/>
  <rect x="75" y="155" width="130" height="90" fill="none" stroke="#4dabf7" stroke-width="3.5"/>
  <rect x="115" y="190" width="40" height="55" fill="none" stroke="#74c0fc" stroke-width="2.5" rx="2"/>
  <circle cx="150" cy="218" r="3" fill="#74c0fc"/>
  <rect x="82" y="170" width="28" height="22" fill="none" stroke="#74c0fc" stroke-width="2"/>
  <line x1="96" y1="170" x2="96" y2="192" stroke="#74c0fc" stroke-width="1.5"/>
  <line x1="82" y1="181" x2="110" y2="181" stroke="#74c0fc" stroke-width="1.5"/>
  <rect x="195" y="170" width="28" height="22" fill="none" stroke="#74c0fc" stroke-width="2"/>
  <line x1="209" y1="170" x2="209" y2="192" stroke="#74c0fc" stroke-width="1.5"/>
  <line x1="195" y1="181" x2="223" y2="181" stroke="#74c0fc" stroke-width="1.5"/>

  <!-- Camera icon (upper right of panel) -->
  <rect x="210" y="46" width="44" height="30" fill="none" stroke="#51cf66" stroke-width="2.5" rx="4"/>
  <circle cx="232" cy="61" r="8" fill="none" stroke="#51cf66" stroke-width="2"/>
  <polygon points="254,51 270,44 270,78 254,71" fill="none" stroke="#51cf66" stroke-width="2" stroke-linejoin="round"/>

  <!-- Shield with checkmark (lower left of panel) -->
  <path d="M 30,232 L 30,208 C 30,205 55,197 55,197 C 55,197 80,205 80,208 L 80,232 C 80,248 55,258 55,258 C 55,258 30,248 30,232 Z" fill="none" stroke="#ffd43b" stroke-width="2.5"/>
  <path d="M 42,226 L 51,237 L 68,216" fill="none" stroke="#ffd43b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Signal dots (decorative) -->
  <circle cx="220" cy="248" r="3.5" fill="#4dabf7" opacity="0.5"/>
  <circle cx="236" cy="248" r="3.5" fill="#4dabf7" opacity="0.75"/>
  <circle cx="252" cy="248" r="3.5" fill="#4dabf7" opacity="1"/>

