<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300">
  <rect width="800" height="300" fill="#ffffff"/>

  <!-- Left accent panel -->
  <rect x="0" y="0" width="280" height="300" fill="#0d2137"/>

  <!-- Cluster box with failed release -->
  <rect x="40" y="52" width="110" height="70" fill="none" stroke="#4dabf7" stroke-width="2.5" rx="6"/>
  <text x="95" y="74" font-family="'Courier New', Courier, monospace" font-size="11" fill="#4dabf7" text-anchor="middle">HelmRelease</text>
  <!-- Red X -->
  <line x1="82" y1="88" x2="108" y2="110" stroke="#ff6b6b" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="108" y1="88" x2="82" y2="110" stroke="#ff6b6b" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Two alert paths -->
  <!-- Event path (direct) -->
  <path d="M 150 70 C 200 60 220 100 216 150" fill="none" stroke="#ffd43b" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="5,4"/>
  <text x="222" y="80" font-family="Arial, sans-serif" font-size="10" fill="#ffd43b" text-anchor="middle">event</text>

  <!-- Metrics path (via prometheus) -->
  <line x1="95" y1="122" x2="95" y2="152" stroke="#51cf66" stroke-width="2" stroke-linecap="round" stroke-dasharray="4,3"/>
  <rect x="52" y="156" width="86" height="28" fill="none" stroke="#51cf66" stroke-width="2" rx="5"/>
  <text x="95" y="174" font-family="'Courier New', Courier, monospace" font-size="10" fill="#51cf66" text-anchor="middle">prometheus</text>
  <path d="M 138 170 C 180 172 200 180 210 196" fill="none" stroke="#51cf66" stroke-width="2" stroke-linecap="round" stroke-dasharray="4,3"/>
  <text x="164" y="196" font-family="Arial, sans-serif" font-size="10" fill="#51cf66" text-anchor="middle">metrics</text>

  <!-- Phone -->
  <rect x="196" y="152" width="44" height="76" fill="none" stroke="#74c0fc" stroke-width="2.5" rx="8"/>
  <line x1="210" y1="160" x2="226" y2="160" stroke="#74c0fc" stroke-width="2"/>
  <circle cx="218" cy="218" r="3" fill="#74c0fc"/>
  <!-- Message bubble -->
  <circle cx="218" cy="188" r="9" fill="#ff6b6b"/>
  <text x="218" y="192" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <!-- Buzz arcs -->
  <path d="M 248 168 C 254 180 254 200 248 212" fill="none" stroke="#ffd43b" stroke-width="2" stroke-linecap="round"/>
  <path d="M 256 160 C 265 178 265 202 256 220" fill="none" stroke="#ffd43b" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Caption -->
  <text x="140" y="266" font-family="'Courier New', Courier, monospace" font-size="11" fill="#adb5bd" text-anchor="middle">Ready=False → Telegram</text>

  <!-- Panel right border -->
  <line x1="280" y1="0" x2="280" y2="300" stroke="#dee2e6" stroke-width="1"/>

  <!-- Project label -->
  <text x="312" y="42" font-family="'Courier New', Courier, monospace" font-size="13" fill="#adb5bd">HomeLab gitDevSecOps / alerting</text>

  <!-- Post title -->
  <text x="312" y="82" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="bold" fill="#0d2137">When a Deploy Fails,</text>
  <text x="312" y="118" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="bold" fill="#0d2137">My Phone Buzzes</text>

  <!-- Tagline -->
  <text x="315" y="150" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#495057">Two Flux alert paths to one Telegram chat</text>

  <!-- Separator -->
  <line x1="312" y1="168" x2="775" y2="168" stroke="#e9ecef" stroke-width="1.5"/>

  <!-- Concept chips row 1 -->
  <rect x="312" y="182" width="132" height="28" fill="#e7f5ff" rx="14" stroke="#4dabf7" stroke-width="1.5"/>
  <text x="378" y="200" font-family="Arial, sans-serif" font-size="12" fill="#1971c2" text-anchor="middle">notification-controller</text>

  <rect x="454" y="182" width="100" height="28" fill="#ebfbee" rx="14" stroke="#51cf66" stroke-width="1.5"/>
  <text x="504" y="200" font-family="Arial, sans-serif" font-size="12" fill="#2f9e44" text-anchor="middle">PrometheusRule</text>

  <rect x="564" y="182" width="88" height="28" fill="#fff9db" rx="14" stroke="#ffd43b" stroke-width="1.5"/>
  <text x="608" y="200" font-family="Arial, sans-serif" font-size="12" fill="#e67700" text-anchor="middle">Alertmanager</text>

  <rect x="662" y="182" width="78" height="28" fill="#f8f0fc" rx="14" stroke="#cc5de8" stroke-width="1.5"/>
  <text x="701" y="200" font-family="Arial, sans-serif" font-size="12" fill="#862e9c" text-anchor="middle">SOPS token</text>

  <!-- Concept chips row 2 -->
  <rect x="312" y="220" width="74" height="26" fill="#fff4e6" rx="13" stroke="#ff922b" stroke-width="1.5"/>
  <text x="349" y="237" font-family="Arial, sans-serif" font-size="12" fill="#d9480f" text-anchor="middle">Event path</text>

  <rect x="396" y="220" width="84" height="26" fill="#e6fcf5" rx="13" stroke="#20c997" stroke-width="1.5"/>
  <text x="438" y="237" font-family="Arial, sans-serif" font-size="12" fill="#0ca678" text-anchor="middle">Metrics path</text>

  <rect x="490" y="220" width="84" height="26" fill="#fff5f5" rx="13" stroke="#ff6b6b" stroke-width="1.5"/>
  <text x="532" y="237" font-family="'Courier New', Courier, monospace" font-size="11" fill="#c92a2a" text-anchor="middle">Ready=False</text>

  <rect x="584" y="220" width="88" height="26" fill="#e7f5ff" rx="13" stroke="#74c0fc" stroke-width="1.5"/>
  <text x="628" y="237" font-family="Arial, sans-serif" font-size="12" fill="#1971c2" text-anchor="middle">Auto-rollback</text>

  <!-- Bottom caption -->
  <text x="312" y="278" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#adb5bd">Failures self-heal or self-announce · never silently broken</text>
</svg>
