<svg viewBox="0 0 800 300" width="800" height="300" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="800" height="300" fill="#ffffff"/><rect x="0" y="0" width="280" height="300" fill="#0d2137"/><line x1="280" y1="0" x2="280" y2="300" stroke="#ffffff" stroke-width="1"/><g stroke="#4dabf7" stroke-width="2.5" fill="none"><rect x="30" y="40" width="220" height="160" rx="10"/><line x1="140" y1="40" x2="140" y2="200" stroke-width="1.5"/><line x1="80" y1="80" x2="200" y2="80" stroke-width="1.5"/><line x1="80" y1="120" x2="200" y2="120" stroke-width="1.5"/><line x1="80" y1="160" x2="200" y2="160" stroke-width="1.5"/></g><g stroke="#51cf66" stroke-width="1.5"><line x1="250" y1="120" x2="290" y2="120" marker-end="url(#arrow)"/><line x1="290" y1="90" x2="290" y2="150"/><line x1="290" y1="90" x2="330" y2="90" marker-end="url(#arrow)"/><line x1="330" y1="60" x2="330" y2="120"/><line x1="330" y1="60" x2="370" y2="60" marker-end="url(#arrow)"/><line x1="370" y1="30" x2="370" y2="90"/><line x1="370" y1="30" x2="410" y2="30" marker-end="url(#arrow)"/><line x1="410" y1="0" x2="410" y2="60"/><line x1="410" y1="0" x2="450" y2="0" marker-end="url(#arrow)"/></g><defs><marker id="arrow" markerWidth="6" markerHeight="4" refX="3" refY="2" orient="auto"><path d="M0,0 L0,4 L6,2 z" fill="#51cf66"/></marker></defs><rect x="310" y="40" width="450" height="220" rx="8" fill="none" stroke="#adb5bd" stroke-width="1.5"/><text x="320" y="80" font-family="Arial, sans-serif" font-size="24" fill="#0d2137" font-weight="bold">Moving my blog and LinkedIn automation into n8n</text><text x="320" y="120" font-family="Arial, sans-serif" font-size="14" fill="#4dabf7">Consolidated Python scripts, CronJob, and GitHub Actions into n8n as a single automation hub</text><text x="320" y="150" font-family="Courier New, Courier, monospace" font-size="12" fill="#ffd43b">• GitHub API refs for branch creation (no native node)<br/>• Tailnet-restricted form URLs (no basic auth)<br/>• Empty-input guard: blocks post/null commits<br/>• ai/high latency hit 112s → sub-workflow timeout</text><text x="320" y="220" font-family="Courier New, Courier, monospace" font-size="11" fill="#868e96">Queue state: git frontmatter → n8n Data Table (no marker commits, no push contention)</text></svg>