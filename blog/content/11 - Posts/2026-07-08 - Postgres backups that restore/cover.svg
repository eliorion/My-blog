<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300">
  <rect width="800" height="300" fill="#ffffff"/>

  <!-- Left accent panel -->
  <rect x="0" y="0" width="280" height="300" fill="#0d2137"/>

  <!-- Postgres cylinder (top) -->
  <ellipse cx="90" cy="58" rx="34" ry="8" fill="none" stroke="#74c0fc" stroke-width="2.5"/>
  <line x1="56" y1="58" x2="56" y2="96" stroke="#74c0fc" stroke-width="2.5"/>
  <line x1="124" y1="58" x2="124" y2="96" stroke="#74c0fc" stroke-width="2.5"/>
  <ellipse cx="90" cy="96" rx="34" ry="8" fill="none" stroke="#74c0fc" stroke-width="2.5"/>
  <text x="90" y="82" font-family="'Courier New', Courier, monospace" font-size="11" fill="#74c0fc" text-anchor="middle">asp-db</text>

  <!-- WAL stream down to bucket -->
  <line x1="90" y1="110" x2="90" y2="160" stroke="#4dabf7" stroke-width="2" stroke-linecap="round" stroke-dasharray="3,4"/>
  <polygon points="84,158 90,170 96,158" fill="#4dabf7"/>
  <text x="104" y="140" font-family="'Courier New', Courier, monospace" font-size="10" fill="#4dabf7">WAL + base</text>

  <!-- R2 bucket -->
  <path d="M 55 176 L 125 176 L 117 226 L 63 226 Z" fill="none" stroke="#ffd43b" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="55" y1="188" x2="125" y2="188" stroke="#ffd43b" stroke-width="1.5"/>
  <text x="90" y="212" font-family="'Courier New', Courier, monospace" font-size="12" fill="#ffd43b" text-anchor="middle">R2</text>

  <!-- Restore arrow back up (green, curved to the right) -->
  <path d="M 135 210 C 195 190 195 90 134 74" fill="none" stroke="#51cf66" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="142,68 128,72 138,84" fill="#51cf66"/>
  <text x="196" y="148" font-family="Arial, sans-serif" font-size="11" fill="#51cf66" text-anchor="middle">restore</text>

  <!-- Caption -->
  <text x="90" y="262" font-family="'Courier New', Courier, monospace" font-size="11" fill="#adb5bd" text-anchor="middle">tested 2026-06-11</text>

  <!-- Panel right border -->
  <line x1="280" y1="0" x2="280" y2="300" stroke="#dee2e6" stroke-width="1"/>

  <!-- Project label -->
  <text x="312" y="42" font-family="'Courier New', Courier, monospace" font-size="13" fill="#adb5bd">HomeLab gitDevSecOps / disaster recovery</text>

  <!-- Post title -->
  <text x="312" y="82" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="bold" fill="#0d2137">Postgres Backups</text>
  <text x="312" y="118" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="bold" fill="#0d2137">That Actually Restore</text>

  <!-- Tagline -->
  <text x="315" y="150" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#495057">CNPG + Barman + Cloudflare R2, proven by a volume loss</text>

  <!-- Separator -->
  <line x1="312" y1="168" x2="775" y2="168" stroke="#e9ecef" stroke-width="1.5"/>

  <!-- Concept chips row 1 -->
  <rect x="312" y="182" width="96" height="28" fill="#e7f5ff" rx="14" stroke="#4dabf7" stroke-width="1.5"/>
  <text x="360" y="200" font-family="Arial, sans-serif" font-size="12" fill="#1971c2" text-anchor="middle">CNPG operator</text>

  <rect x="418" y="182" width="92" height="28" fill="#ebfbee" rx="14" stroke="#51cf66" stroke-width="1.5"/>
  <text x="464" y="200" font-family="Arial, sans-serif" font-size="12" fill="#2f9e44" text-anchor="middle">Barman + WAL</text>

  <rect x="520" y="182" width="100" height="28" fill="#fff9db" rx="14" stroke="#ffd43b" stroke-width="1.5"/>
  <text x="570" y="200" font-family="'Courier New', Courier, monospace" font-size="11" fill="#e67700" text-anchor="middle">immediate: true</text>

  <rect x="630" y="182" width="90" height="28" fill="#fff4e6" rx="14" stroke="#ff922b" stroke-width="1.5"/>
  <text x="675" y="200" font-family="Arial, sans-serif" font-size="12" fill="#d9480f" text-anchor="middle">Cloudflare R2</text>

  <!-- Concept chips row 2 -->
  <rect x="312" y="220" width="80" height="26" fill="#fff5f5" rx="13" stroke="#ff6b6b" stroke-width="1.5"/>
  <text x="352" y="237" font-family="Arial, sans-serif" font-size="12" fill="#c92a2a" text-anchor="middle">Volume loss</text>

  <rect x="402" y="220" width="122" height="26" fill="#e6fcf5" rx="13" stroke="#20c997" stroke-width="1.5"/>
  <text x="463" y="237" font-family="Arial, sans-serif" font-size="12" fill="#0ca678" text-anchor="middle">Restore to asp-db-r1</text>

  <rect x="534" y="220" width="88" height="26" fill="#f8f0fc" rx="13" stroke="#cc5de8" stroke-width="1.5"/>
  <text x="578" y="237" font-family="Arial, sans-serif" font-size="12" fill="#862e9c" text-anchor="middle">WAL collision</text>

  <rect x="632" y="220" width="94" height="26" fill="#e7f5ff" rx="13" stroke="#74c0fc" stroke-width="1.5"/>
  <text x="679" y="237" font-family="Arial, sans-serif" font-size="12" fill="#1971c2" text-anchor="middle">Tested restore</text>

  <!-- Bottom caption -->
  <text x="312" y="278" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#adb5bd">One database restored · one recreated empty · the config was the difference</text>
</svg>
