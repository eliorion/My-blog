<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300">
  <rect width="800" height="300" fill="#ffffff"/>

  <!-- Left accent panel -->
  <rect x="0" y="0" width="280" height="300" fill="#1c1c2e"/>

  <!-- Lock body -->
  <rect x="95" y="140" width="90" height="75" fill="none" stroke="#ffd43b" stroke-width="3.5" rx="8"/>
  <!-- Lock shackle (arch) -->
  <path d="M 110,140 L 110,112 A 30,30 0 0 1 170,112 L 170,140" fill="none" stroke="#ffd43b" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Keyhole circle -->
  <circle cx="140" cy="167" r="10" fill="none" stroke="#ffd43b" stroke-width="2.5"/>
  <!-- Keyhole slot -->
  <line x1="140" y1="177" x2="140" y2="197" stroke="#ffd43b" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Encrypted value lines (right side of panel) -->
  <!-- Label -->
  <text x="200" y="102" font-family="'Courier New', Courier, monospace" font-size="9" fill="#6c757d">TOKEN=</text>
  <!-- Encrypted blob lines -->
  <rect x="196" y="107" width="65" height="7" fill="#2d3561" rx="2"/>
  <rect x="196" y="118" width="55" height="7" fill="#2d3561" rx="2"/>
  <rect x="196" y="129" width="60" height="7" fill="#2d3561" rx="2"/>
  <rect x="196" y="140" width="48" height="7" fill="#2d3561" rx="2"/>

  <!-- "ENC[...]" badge -->
  <rect x="190" y="154" width="75" height="20" fill="#2c2c54" rx="4" stroke="#ffd43b" stroke-width="1.5"/>
  <text x="227" y="167" font-family="'Courier New', Courier, monospace" font-size="9" fill="#ffd43b" text-anchor="middle">ENC[AES256_GCM]</text>

  <!-- AGE key icon (bottom left) -->
  <!-- Key shaft -->
  <line x1="38" y1="248" x2="88" y2="248" stroke="#51cf66" stroke-width="3" stroke-linecap="round"/>
  <!-- Key teeth -->
  <line x1="62" y1="248" x2="62" y2="260" stroke="#51cf66" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="72" y1="248" x2="72" y2="256" stroke="#51cf66" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="82" y1="248" x2="82" y2="260" stroke="#51cf66" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Key head (circle) -->
  <circle cx="30" cy="248" r="12" fill="none" stroke="#51cf66" stroke-width="3"/>
  <circle cx="30" cy="248" r="5" fill="none" stroke="#51cf66" stroke-width="2"/>

  <!-- "age1..." label -->
  <text x="36" y="278" font-family="'Courier New', Courier, monospace" font-size="9" fill="#51cf66">age1vdwr...mc3</text>

  <!-- .sops.yaml badge -->
  <rect x="168" y="238" width="96" height="20" fill="#1a1a2e" rx="4" stroke="#74c0fc" stroke-width="1.5"/>
  <text x="216" y="251" font-family="'Courier New', Courier, monospace" font-size="9" fill="#74c0fc" text-anchor="middle">.sops.yaml</text>

  <!-- Panel right border -->
  <line x1="280" y1="0" x2="280" y2="300" stroke="#dee2e6" stroke-width="1"/>

  <!-- Project label -->
  <text x="312" y="42" font-family="'Courier New', Courier, monospace" font-size="13" fill="#adb5bd">mve-itguard / series 3</text>

  <!-- Post title -->
  <text x="312" y="82" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="bold" fill="#1c1c2e">Secrets in Git</text>
  <text x="312" y="118" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="bold" fill="#1c1c2e">Without Fear</text>

  <!-- Tagline -->
  <text x="315" y="150" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#495057">SOPS + AGE · Encrypt values, commit ciphertext</text>

  <!-- Separator -->
  <line x1="312" y1="168" x2="775" y2="168" stroke="#e9ecef" stroke-width="1.5"/>

  <!-- Concept chips row 1 -->
  <rect x="312" y="182" width="52" height="28" fill="#fff3bf" rx="14" stroke="#ffd43b" stroke-width="1.5"/>
  <text x="338" y="200" font-family="Arial, sans-serif" font-size="12" fill="#e67700" text-anchor="middle">SOPS</text>

  <rect x="374" y="182" width="46" height="28" fill="#ebfbee" rx="14" stroke="#51cf66" stroke-width="1.5"/>
  <text x="397" y="200" font-family="Arial, sans-serif" font-size="12" fill="#2f9e44" text-anchor="middle">AGE</text>

  <rect x="430" y="182" width="100" height="28" fill="#e7f5ff" rx="14" stroke="#4dabf7" stroke-width="1.5"/>
  <text x="480" y="200" font-family="Arial, sans-serif" font-size="12" fill="#1971c2" text-anchor="middle">Value-level encrypt</text>

  <rect x="540" y="182" width="88" height="28" fill="#f8f0fc" rx="14" stroke="#cc5de8" stroke-width="1.5"/>
  <text x="584" y="200" font-family="Arial, sans-serif" font-size="12" fill="#862e9c" text-anchor="middle">Commit .enc files</text>

  <rect x="638" y="182" width="70" height="28" fill="#fff4e6" rx="14" stroke="#ff922b" stroke-width="1.5"/>
  <text x="673" y="200" font-family="Arial, sans-serif" font-size="12" fill="#d9480f" text-anchor="middle">.sops.yaml</text>

  <!-- Concept chips row 2 -->
  <rect x="312" y="220" width="90" height="26" fill="#e6fcf5" rx="13" stroke="#20c997" stroke-width="1.5"/>
  <text x="357" y="237" font-family="Arial, sans-serif" font-size="12" fill="#0ca678" text-anchor="middle">No plaintext CI</text>

  <rect x="412" y="220" width="88" height="26" fill="#fff5f5" rx="13" stroke="#ff6b6b" stroke-width="1.5"/>
  <text x="456" y="237" font-family="Arial, sans-serif" font-size="12" fill="#c92a2a" text-anchor="middle">Key rotation</text>

  <rect x="510" y="220" width="82" height="26" fill="#e7f5ff" rx="13" stroke="#74c0fc" stroke-width="1.5"/>
  <text x="551" y="237" font-family="Arial, sans-serif" font-size="12" fill="#1971c2" text-anchor="middle">Root of trust</text>

  <rect x="602" y="220" width="106" height="26" fill="#fff9db" rx="13" stroke="#ffd43b" stroke-width="1.5"/>
  <text x="655" y="237" font-family="Arial, sans-serif" font-size="12" fill="#e67700" text-anchor="middle">Auditable in Git diff</text>

  <!-- Bottom caption -->
  <text x="312" y="278" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#adb5bd">dev · server · CI/CD · all use same encrypted files from Git</text>
</svg>
