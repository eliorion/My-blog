theme = "PaperMod"
baseURL = "https://eliorion.github.io/My-blog"
title = 'Eliorion blog'

[outputs]
home = ["HTML", "RSS", "JSON"]

[params]
showReadingTime = true
showBreadCrumbs = true
showPostNavLinks = true
ShowLanguageSelector = true

defaultContentLanguage = "en"
[languages]
[languages.en]
languageName = "English"
weight = 1

# [languages.fr]
#   languageName = "Français"
#   weight = 2

[[menu.main]]
identifier = "about"
name = "About"
url = "/about/"
weight = 10

[[menu.main]]
identifier = "archives"
name = "Archive"
url = "/archives/"
weight = 14

[[menu.main]]
identifier = "search"
name = "Search"
url = "/search/"
weight = 20

[[menu.main]]
identifier = "posts"
name = "Posts"
url = "/posts/"
weight = 19

[[menu.main]]
identifier = "topics"
name = "Topics"
url = "/topics/"
weight = 16

[[menu.main]]
identifier = "categories"
name = "Categories"
url = "/categories/"
weight = 15

[[menu.main]]
identifier = "tags"
name = "Tags"
url = "/tags/"
weight = 17

[[menu.main]]
identifier = "projects"
name = "Projects"
url = "/projects/"
weight = 18

[permalinks]
"11---posts" = "/posts/:slug/"

[taxonomies]
category = "categories"
tag = "tags"
topic = "topics"        # ← on peut ajouter "topics" si on veut un regroupement spécifique
project = "projects"

# Homepage (rendered by layouts/index.html)
[languages.en.params.home]
title = "Eliorion"
tagline = "Homelab, Kubernetes, and everything that breaks in between."
intro = """
I run a homelab as a production system: real clusters, real GitOps, real backups,
real 3 a.m. failures. This blog is the write-up of that: what I built, what broke,
and what the fix actually was.
"""

[[languages.en.params.home.pillars]]
title = "Build the cluster"
body = "Talos and K3s on Proxmox, storage on Longhorn and ZFS, everything declared, nothing clicked."
topic = "Homelab"

[[languages.en.params.home.pillars]]
title = "Ship it like production"
body = "GitOps with Flux, self-hosted runners, release automation. A merge is the only deploy button."
topic = "DevOps"

[[languages.en.params.home.pillars]]
title = "Survive the bad day"
body = "Encrypted secrets, key rotation, offsite immutable backups, and restores I have actually tested."
topic = "Security"

[[languages.en.params.home.stack]]
group = "Platform"
tags = ["talos.linux", "kubernetes", "K3S", "proxmox", "nixos"]

[[languages.en.params.home.stack]]
group = "Delivery"
tags = ["gitops", "flux", "helm", "github-actions", "ci-cd"]

[[languages.en.params.home.stack]]
group = "Storage"
tags = ["longhorn", "zfs", "postgres", "cnpg", "backup"]

[[languages.en.params.home.stack]]
group = "Security"
tags = ["sops", "age", "encryption", "tailscale", "trivy"]

