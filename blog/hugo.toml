theme = "PaperMod"
baseURL = "https://eliorion.github.io/My-blog"
title = 'Eliorion blog'

[outputs]
home = ["HTML", "RSS", "JSON"]

[params]
showReadingTime = true
showBreadCrumbs = true
showPostNavLinks = true
ShowLanguageSelector = true

defaultContentLanguage = "en"
[languages]
[languages.en]
languageName = "English"
weight = 1

# [languages.fr]
#   languageName = "Français"
#   weight = 2

[[menu.main]]
identifier = "about"
name = "About"
url = "/about/"
weight = 10

[[menu.main]]
identifier = "archives"
name = "Archive"
url = "/archives/"
weight = 14

[[menu.main]]
identifier = "search"
name = "Search"
url = "/search/"
weight = 20

[[menu.main]]
identifier = "posts"
name = "Posts"
url = "/posts/"
weight = 19

[[menu.main]]
identifier = "topics"
name = "Topics"
url = "/topics/"
weight = 16

[[menu.main]]
identifier = "categories"
name = "Categories"
url = "/categories/"
weight = 15

[[menu.main]]
identifier = "tags"
name = "Tags"
url = "/tags/"
weight = 17

[[menu.main]]
identifier = "projects"
name = "Projects"
url = "/projects/"
weight = 18

[permalinks]
posts = "/posts/:slug/"

[taxonomies]
category = "categories"
tag = "tags"
topic = "topics"        # ← on peut ajouter "topics" si on veut un regroupement spécifique
project = "projects"

[languages.en.params.profileMode]
enabled = true
title = "👋 Eliorion's blog"
subtitle = "My journey in homelab, Kubernetes, and engineering management. 🚀"

[[languages.en.params.profileMode.buttons]]
name = "Posts"
url = "/posts/"

[[languages.en.params.profileMode.buttons]]
name = "Topics"
url = "/topics/"

[[languages.en.params.profileMode.buttons]]
name = "Archive"
url = "/archives/"

