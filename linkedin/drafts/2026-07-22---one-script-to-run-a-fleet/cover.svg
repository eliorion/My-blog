<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300">
  <rect width="800" height="300" fill="#ffffff"/>

  <!-- Left accent panel -->
  <rect x="0" y="0" width="280" height="300" fill="#0d2137"/>

  <!-- Terminal window -->
  <rect x="30" y="46" width="220" height="150" fill="none" stroke="#4dabf7" stroke-width="2.5" rx="8"/>
  <line x1="30" y1="72" x2="250" y2="72" stroke="#4dabf7" stroke-width="1.5"/>
  <circle cx="46" cy="59" r="4" fill="#ff6b6b"/>
  <circle cx="60" cy="59" r="4" fill="#ffd43b"/>
  <circle cx="74" cy="59" r="4" fill="#51cf66"/>

  <text x="44" y="94" font-family="'Courier New', Courier, monospace" font-size="12" fill="#51cf66">$ fleet new c</text>
  <text x="44" y="114" font-family="'Courier New', Courier, monospace" font-size="12" fill="#74c0fc">$ fleet install c</text>
  <text x="44" y="134" font-family="'Courier New', Courier, monospace" font-size="12" fill="#ffd43b">$ fleet deploy c</text>
  <text x="44" y="154" font-family="'Courier New', Courier, monospace" font-size="12" fill="#cc5de8">$ fleet unlock c</text>
  <text x="44" y="174" font-family="'Courier New', Courier, monospace" font-size="12" fill="#adb5bd">$ fleet status</text>

  <!-- Status dots below terminal -->
  <circle cx="66" cy="226" r="6" fill="none" stroke="#51cf66" stroke-width="2.5"/>
  <path d="M 63 226 l 2 3 l 5 -6" fill="none" stroke="#51cf66" stroke-width="2"/>
  <circle cx="106" cy="226" r="6" fill="none" stroke="#51cf66" stroke-width="2.5"/>
  <path d="M 103 226 l 2 3 l 5 -6" fill="none" stroke="#51cf66" stroke-width="2"/>
  <circle cx="146" cy="226" r="6" fill="none" stroke="#51cf66" stroke-width="2.5"/>
  <path d="M 143 226 l 2 3 l 5 -6" fill="none" stroke="#51cf66" stroke-width="2"/>
  <circle cx="186" cy="226" r="6" fill="none" stroke="#ffd43b" stroke-width="2.5"/>
  <text x="126" y="262" font-family="'Courier New', Courier, monospace" font-size="12" fill="#adb5bd" text-anchor="middle">a · b · c · d</text>

  <!-- Panel right border -->
  <line x1="280" y1="0" x2="280" y2="300" stroke="#dee2e6" stroke-width="1"/>

  <!-- Project label -->
  <text x="312" y="42" font-family="'Courier New', Courier, monospace" font-size="13" fill="#adb5bd">garage-fleet / tooling</text>

  <!-- Post title -->
  <text x="312" y="82" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="bold" fill="#0d2137">One Script</text>
  <text x="312" y="118" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="bold" fill="#0d2137">to Run a Fleet</text>

  <!-- Tagline -->
  <text x="315" y="150" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#495057">new · install · deploy · unlock · status — one entrypoint</text>

  <!-- Separator -->
  <line x1="312" y1="168" x2="775" y2="168" stroke="#e9ecef" stroke-width="1.5"/>

  <!-- Concept chips row 1 -->
  <rect x="312" y="182" width="115" height="28" fill="#fff5f5" rx="14" stroke="#ff6b6b" stroke-width="1.5"/>
  <text x="369.5" y="200" font-family="Arial, sans-serif" font-size="12" fill="#c92a2a" text-anchor="middle">Pre-wipe guards</text>

  <rect x="437" y="182" width="105" height="28" fill="#ebfbee" rx="14" stroke="#51cf66" stroke-width="1.5"/>
  <text x="489.5" y="200" font-family="Arial, sans-serif" font-size="12" fill="#2f9e44" text-anchor="middle">Magic-rollback</text>

  <rect x="552" y="182" width="128" height="28" fill="#fff9db" rx="14" stroke="#ffd43b" stroke-width="1.5"/>
  <text x="616" y="200" font-family="Arial, sans-serif" font-size="12" fill="#e67700" text-anchor="middle">deploy --detached</text>

  <rect x="690" y="182" width="77" height="28" fill="#f8f0fc" rx="14" stroke="#cc5de8" stroke-width="1.5"/>
  <text x="728.5" y="200" font-family="Arial, sans-serif" font-size="12" fill="#862e9c" text-anchor="middle">TUI menu</text>

  <!-- Concept chips row 2 -->
  <rect x="312" y="220" width="150" height="26" fill="#e6fcf5" rx="13" stroke="#20c997" stroke-width="1.5"/>
  <text x="387" y="237" font-family="Arial, sans-serif" font-size="12" fill="#0ca678" text-anchor="middle">stdin-only passphrase</text>

  <rect x="472" y="220" width="138" height="26" fill="#e7f5ff" rx="13" stroke="#4dabf7" stroke-width="1.5"/>
  <text x="541" y="237" font-family="Arial, sans-serif" font-size="12" fill="#1971c2" text-anchor="middle">Declarative buckets</text>

  <rect x="620" y="220" width="109" height="26" fill="#fff4e6" rx="13" stroke="#ff922b" stroke-width="1.5"/>
  <text x="674.5" y="237" font-family="Arial, sans-serif" font-size="12" fill="#d9480f" text-anchor="middle">Layout as code</text>

  <!-- Bottom caption -->
  <text x="312" y="278" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#adb5bd">The dangerous paths are the scripted paths · scar tissue, executable</text>
</svg>
