<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300">
  <rect width="800" height="300" fill="#ffffff"/>

  <!-- Left accent panel -->
  <rect x="0" y="0" width="280" height="300" fill="#1a2744"/>

  <!-- Server box -->
  <rect x="85" y="48" width="110" height="44" rx="4" fill="none" stroke="#4dabf7" stroke-width="3"/>
  <circle cx="100" cy="70" r="3.5" fill="#51cf66"/>
  <line x1="115" y1="63" x2="180" y2="63" stroke="#74c0fc" stroke-width="1.5"/>
  <line x1="115" y1="71" x2="180" y2="71" stroke="#74c0fc" stroke-width="1.5"/>
  <line x1="115" y1="79" x2="165" y2="79" stroke="#74c0fc" stroke-width="1.5"/>

  <!-- Arrow down -->
  <line x1="140" y1="92" x2="140" y2="126" stroke="#ff922b" stroke-width="2.5"/>
  <polygon points="133,124 147,124 140,138" fill="#ff922b"/>

  <!-- Cylinder 1 (NFS volume) -->
  <path d="M 81,155 v 52 a 34,11 0 0 0 68,0 v -52" fill="none" stroke="#ff922b" stroke-width="3"/>
  <ellipse cx="115" cy="155" rx="34" ry="11" fill="#1a2744" stroke="#ff922b" stroke-width="3"/>
  <text x="115" y="190" font-family="'DejaVu Sans Mono', monospace" font-size="14" fill="#74c0fc" text-anchor="middle">nfs</text>

  <!-- Cylinder 2 (replica) -->
  <path d="M 152,182 v 40 a 26,8 0 0 0 52,0 v -40" fill="none" stroke="#51cf66" stroke-width="2.5"/>
  <ellipse cx="178" cy="182" rx="26" ry="8" fill="#1a2744" stroke="#51cf66" stroke-width="2.5"/>

  <!-- Signal dots -->
  <circle cx="220" cy="256" r="3.5" fill="#4dabf7" opacity="0.5"/>
  <circle cx="236" cy="256" r="3.5" fill="#4dabf7" opacity="0.75"/>
  <circle cx="252" cy="256" r="3.5" fill="#4dabf7" opacity="1"/>

  <!-- Panel right border -->
  <line x1="280" y1="0" x2="280" y2="300" stroke="#dee2e6" stroke-width="1"/>

  <!-- Title -->
  <text x="312" y="95" font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="50" font-weight="bold" fill="#1a2744" letter-spacing="-1">persistence</text>

  <!-- Tagline -->
  <text x="315" y="128" font-family="'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#495057" letter-spacing="0.3">NFS-backed persistent volumes for Kubernetes</text>

  <!-- Separator -->
  <line x1="312" y1="148" x2="775" y2="148" stroke="#e9ecef" stroke-width="1.5"/>

  <!-- Chips row 1 -->
  <rect x="312" y="163" width="73" height="28" fill="#e7f5ff" rx="14" stroke="#4dabf7" stroke-width="1.5"/>
  <text x="348" y="181" font-family="'DejaVu Sans', sans-serif" font-size="12" fill="#1971c2" text-anchor="middle">TrueNAS</text>

  <rect x="395" y="163" width="46" height="28" fill="#fff4e6" rx="14" stroke="#ff922b" stroke-width="1.5"/>
  <text x="418" y="181" font-family="'DejaVu Sans', sans-serif" font-size="12" fill="#d9480f" text-anchor="middle">NFS</text>

  <rect x="451" y="163" width="46" height="28" fill="#ebfbee" rx="14" stroke="#51cf66" stroke-width="1.5"/>
  <text x="474" y="181" font-family="'DejaVu Sans', sans-serif" font-size="12" fill="#2f9e44" text-anchor="middle">PVC</text>

  <rect x="507" y="163" width="46" height="28" fill="#ebfbee" rx="14" stroke="#51cf66" stroke-width="1.5"/>
  <text x="530" y="181" font-family="'DejaVu Sans', sans-serif" font-size="12" fill="#2f9e44" text-anchor="middle">K8s</text>

  <!-- Chips row 2 -->
  <rect x="312" y="202" width="66" height="26" fill="#f8f0fc" rx="13" stroke="#cc5de8" stroke-width="1.5"/>
  <text x="345" y="219" font-family="'DejaVu Sans', sans-serif" font-size="12" fill="#862e9c" text-anchor="middle">Pulumi</text>

  <rect x="388" y="202" width="46" height="26" fill="#fff9db" rx="13" stroke="#ffd43b" stroke-width="1.5"/>
  <text x="411" y="219" font-family="'DejaVu Sans', sans-serif" font-size="12" fill="#e67700" text-anchor="middle">IaC</text>

  <rect x="444" y="202" width="73" height="26" fill="#e6fcf5" rx="13" stroke="#20c997" stroke-width="1.5"/>
  <text x="480" y="219" font-family="'DejaVu Sans', sans-serif" font-size="12" fill="#0ca678" text-anchor="middle">Storage</text>

  <!-- Bottom caption -->
  <text x="312" y="272" font-family="'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#adb5bd">TrueNAS share · NFS provisioner · PVC/PV lifecycle</text>
</svg>
