<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300">
  <rect width="800" height="300" fill="#ffffff"/>

  <!-- Left accent panel -->
  <rect x="0" y="0" width="280" height="300" fill="#1a2744"/>

  <!-- Terminal with vim/tmux -->
  <rect x="70" y="55" width="140" height="85" rx="6" fill="none" stroke="#4dabf7" stroke-width="3"/>
  <text x="85" y="90" font-family="'DejaVu Sans Mono', monospace" font-size="15" fill="#51cf66">:wq</text>
  <text x="85" y="112" font-family="'DejaVu Sans Mono', monospace" font-size="15" fill="#74c0fc">~</text>
  <text x="100" y="112" font-family="'DejaVu Sans Mono', monospace" font-size="15" fill="#74c0fc">~</text>
  <!-- tmux status bar -->
  <rect x="70" y="122" width="140" height="18" fill="none" stroke="#74c0fc" stroke-width="1.5"/>
  <text x="78" y="135" font-family="'DejaVu Sans Mono', monospace" font-size="11" fill="#ffd43b">[0] 0:vim*</text>

  <!-- Keyboard -->
  <rect x="55" y="175" width="170" height="65" rx="8" fill="none" stroke="#51cf66" stroke-width="3"/>
  <!-- Row 1 -->
  <rect x="66" y="184" width="14" height="12" rx="2" fill="none" stroke="#74c0fc" stroke-width="1.5"/>
  <rect x="85" y="184" width="14" height="12" rx="2" fill="none" stroke="#74c0fc" stroke-width="1.5"/>
  <rect x="104" y="184" width="14" height="12" rx="2" fill="none" stroke="#74c0fc" stroke-width="1.5"/>
  <rect x="123" y="184" width="14" height="12" rx="2" fill="none" stroke="#74c0fc" stroke-width="1.5"/>
  <rect x="142" y="184" width="14" height="12" rx="2" fill="none" stroke="#74c0fc" stroke-width="1.5"/>
  <rect x="161" y="184" width="14" height="12" rx="2" fill="none" stroke="#74c0fc" stroke-width="1.5"/>
  <rect x="180" y="184" width="14" height="12" rx="2" fill="none" stroke="#74c0fc" stroke-width="1.5"/>
  <rect x="199" y="184" width="14" height="12" rx="2" fill="none" stroke="#74c0fc" stroke-width="1.5"/>
  <!-- Row 2 (f and j highlighted = home row) -->
  <rect x="71" y="201" width="14" height="12" rx="2" fill="none" stroke="#74c0fc" stroke-width="1.5"/>
  <rect x="90" y="201" width="14" height="12" rx="2" fill="none" stroke="#74c0fc" stroke-width="1.5"/>
  <rect x="109" y="201" width="14" height="12" rx="2" fill="none" stroke="#ffd43b" stroke-width="2"/>
  <rect x="128" y="201" width="14" height="12" rx="2" fill="none" stroke="#74c0fc" stroke-width="1.5"/>
  <rect x="147" y="201" width="14" height="12" rx="2" fill="none" stroke="#ffd43b" stroke-width="2"/>
  <rect x="166" y="201" width="14" height="12" rx="2" fill="none" stroke="#74c0fc" stroke-width="1.5"/>
  <rect x="185" y="201" width="14" height="12" rx="2" fill="none" stroke="#74c0fc" stroke-width="1.5"/>
  <!-- Row 3: spacebar -->
  <rect x="95" y="218" width="90" height="12" rx="2" fill="none" stroke="#74c0fc" stroke-width="1.5"/>
  <rect x="66" y="218" width="22" height="12" rx="2" fill="none" stroke="#74c0fc" stroke-width="1.5"/>
  <rect x="192" y="218" width="22" height="12" rx="2" fill="none" stroke="#74c0fc" stroke-width="1.5"/>

  <!-- Signal dots (top right) -->
  <circle cx="228" cy="60" r="3.5" fill="#4dabf7" opacity="0.5"/>
  <circle cx="244" cy="60" r="3.5" fill="#4dabf7" opacity="0.75"/>
  <circle cx="260" cy="60" r="3.5" fill="#4dabf7" opacity="1"/>

  <!-- Panel right border -->
  <line x1="280" y1="0" x2="280" y2="300" stroke="#dee2e6" stroke-width="1"/>

  <!-- Title -->
  <text x="312" y="95" font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="44" font-weight="bold" fill="#1a2744" letter-spacing="-1">beginner again</text>

  <!-- Tagline -->
  <text x="315" y="128" font-family="'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#495057" letter-spacing="0.3">Back to fundamentals: keyboard-first Linux</text>

  <!-- Separator -->
  <line x1="312" y1="148" x2="775" y2="148" stroke="#e9ecef" stroke-width="1.5"/>

  <!-- Chips row 1 -->
  <rect x="312" y="163" width="50" height="28" fill="#ebfbee" rx="14" stroke="#51cf66" stroke-width="1.5"/>
  <text x="337" y="181" font-family="'DejaVu Sans', sans-serif" font-size="12" fill="#2f9e44" text-anchor="middle">tmux</text>

  <rect x="372" y="163" width="41" height="28" fill="#e7f5ff" rx="14" stroke="#4dabf7" stroke-width="1.5"/>
  <text x="392.5" y="181" font-family="'DejaVu Sans', sans-serif" font-size="12" fill="#1971c2" text-anchor="middle">vim</text>

  <rect x="423" y="163" width="37" height="28" fill="#fff9db" rx="14" stroke="#ffd43b" stroke-width="1.5"/>
  <text x="441.5" y="181" font-family="'DejaVu Sans', sans-serif" font-size="12" fill="#e67700" text-anchor="middle">CLI</text>

  <!-- Chips row 2 -->
  <rect x="312" y="202" width="96" height="26" fill="#f8f0fc" rx="13" stroke="#cc5de8" stroke-width="1.5"/>
  <text x="360" y="219" font-family="'DejaVu Sans', sans-serif" font-size="12" fill="#862e9c" text-anchor="middle">Touch Typing</text>

  <rect x="418" y="202" width="70" height="26" fill="#e6fcf5" rx="13" stroke="#20c997" stroke-width="1.5"/>
  <text x="453" y="219" font-family="'DejaVu Sans', sans-serif" font-size="12" fill="#0ca678" text-anchor="middle">Terminal</text>

  <rect x="498" y="202" width="66" height="26" fill="#fff4e6" rx="13" stroke="#ff922b" stroke-width="1.5"/>
  <text x="531" y="219" font-family="'DejaVu Sans', sans-serif" font-size="12" fill="#d9480f" text-anchor="middle">Mindset</text>

  <!-- Bottom caption -->
  <text x="312" y="272" font-family="'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#adb5bd">Touch typing · tmux · vim · One terminal for everything</text>
</svg>
