<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300">
  <rect width="800" height="300" fill="#ffffff"/>

  <!-- Left accent panel -->
  <rect x="0" y="0" width="280" height="300" fill="#1a2744"/>

  <!-- Terminal window -->
  <rect x="55" y="70" width="170" height="130" rx="8" fill="none" stroke="#4dabf7" stroke-width="3"/>
  <line x1="55" y1="98" x2="225" y2="98" stroke="#4dabf7" stroke-width="2"/>
  <circle cx="72" cy="84" r="4" fill="#ff6b6b"/>
  <circle cx="88" cy="84" r="4" fill="#ffd43b"/>
  <circle cx="104" cy="84" r="4" fill="#51cf66"/>
  <text x="70" y="130" font-family="'DejaVu Sans Mono', monospace" font-size="16" fill="#74c0fc">$ whoami</text>
  <text x="70" y="156" font-family="'DejaVu Sans Mono', monospace" font-size="16" fill="#ffd43b">eliorion</text>
  <rect x="70" y="168" width="10" height="16" fill="#74c0fc" opacity="0.9"/>

  <!-- RSS icon (bottom left) -->
  <circle cx="52" cy="252" r="3.5" fill="#ffd43b"/>
  <path d="M 49,232 A 20,20 0 0 1 69,252" fill="none" stroke="#ffd43b" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 49,218 A 34,34 0 0 1 83,252" fill="none" stroke="#ffd43b" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Signal dots -->
  <circle cx="220" cy="248" r="3.5" fill="#4dabf7" opacity="0.5"/>
  <circle cx="236" cy="248" r="3.5" fill="#4dabf7" opacity="0.75"/>
  <circle cx="252" cy="248" r="3.5" fill="#4dabf7" opacity="1"/>

  <!-- Panel right border -->
  <line x1="280" y1="0" x2="280" y2="300" stroke="#dee2e6" stroke-width="1"/>

  <!-- Title -->
  <text x="312" y="95" font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="48" font-weight="bold" fill="#1a2744" letter-spacing="-1">hello, world</text>

  <!-- Tagline -->
  <text x="315" y="128" font-family="'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#495057" letter-spacing="0.3">Why I finally started sharing my homelab journey</text>

  <!-- Separator -->
  <line x1="312" y1="148" x2="775" y2="148" stroke="#e9ecef" stroke-width="1.5"/>

  <!-- Chips -->
  <rect x="312" y="163" width="53" height="28" fill="#e7f5ff" rx="14" stroke="#4dabf7" stroke-width="1.5"/>
  <text x="338" y="181" font-family="'DejaVu Sans', sans-serif" font-size="12" fill="#1971c2" text-anchor="middle">Hugo</text>

  <rect x="375" y="163" width="106" height="28" fill="#e6fcf5" rx="14" stroke="#20c997" stroke-width="1.5"/>
  <text x="428" y="181" font-family="'DejaVu Sans', sans-serif" font-size="12" fill="#0ca678" text-anchor="middle">GitHub Pages</text>

  <rect x="491" y="163" width="73" height="28" fill="#fff9db" rx="14" stroke="#ffd43b" stroke-width="1.5"/>
  <text x="527" y="181" font-family="'DejaVu Sans', sans-serif" font-size="12" fill="#e67700" text-anchor="middle">Homelab</text>

  <rect x="574" y="163" width="53" height="28" fill="#f8f0fc" rx="14" stroke="#cc5de8" stroke-width="1.5"/>
  <text x="600" y="181" font-family="'DejaVu Sans', sans-serif" font-size="12" fill="#862e9c" text-anchor="middle">Blog</text>

  <!-- Bottom caption -->
  <text x="312" y="272" font-family="'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#adb5bd">eliorion.github.io/My-blog · Homelab · DevOps · Security</text>
</svg>
