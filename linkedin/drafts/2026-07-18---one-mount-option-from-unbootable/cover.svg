<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300">
  <rect width="800" height="300" fill="#ffffff"/>

  <!-- Left accent panel -->
  <rect x="0" y="0" width="280" height="300" fill="#0d2137"/>

  <!-- Boot chain: power -> import -> mount -> sshd -->
  <circle cx="60" cy="60" r="14" fill="none" stroke="#4dabf7" stroke-width="2.5"/>
  <line x1="60" y1="52" x2="60" y2="62" stroke="#4dabf7" stroke-width="2.5" stroke-linecap="round"/>
  <text x="92" y="65" font-family="'Courier New', Courier, monospace" font-size="11" fill="#4dabf7">boot</text>

  <line x1="60" y1="76" x2="60" y2="102" stroke="#4dabf7" stroke-width="2.5" stroke-dasharray="4,3"/>
  <polygon points="53,100 60,112 67,100" fill="#4dabf7"/>

  <!-- zfs-import box with red X -->
  <rect x="24" y="116" width="140" height="34" fill="none" stroke="#ff6b6b" stroke-width="2.5" rx="6"/>
  <text x="86" y="138" font-family="'Courier New', Courier, monospace" font-size="11" fill="#ff6b6b" text-anchor="middle">zfs-import-dpool</text>
  <line x1="180" y1="118" x2="204" y2="146" stroke="#ff6b6b" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="204" y1="118" x2="180" y2="146" stroke="#ff6b6b" stroke-width="3.5" stroke-linecap="round"/>

  <!-- noauto label -->
  <text x="94" y="172" font-family="'Courier New', Courier, monospace" font-size="12" fill="#ffd43b" text-anchor="middle">["noauto","nofail"]</text>

  <!-- strikethrough noauto, fix below -->
  <line x1="34" y1="167" x2="112" y2="167" stroke="#ff6b6b" stroke-width="2"/>

  <line x1="94" y1="184" x2="94" y2="204" stroke="#51cf66" stroke-width="2.5" stroke-dasharray="4,3"/>
  <polygon points="87,202 94,214 101,202" fill="#51cf66"/>

  <!-- fixed box -->
  <rect x="34" y="218" width="120" height="32" fill="none" stroke="#51cf66" stroke-width="2.5" rx="6"/>
  <text x="94" y="239" font-family="'Courier New', Courier, monospace" font-size="12" fill="#51cf66" text-anchor="middle">["nofail"]</text>
  <circle cx="184" cy="234" r="12" fill="none" stroke="#51cf66" stroke-width="2.5"/>
  <path d="M 178 234 l 4 5 l 8 -10" fill="none" stroke="#51cf66" stroke-width="2.5" stroke-linecap="round"/>

  <text x="140" y="278" font-family="'Courier New', Courier, monospace" font-size="12" fill="#adb5bd" text-anchor="middle">pool imports · mount waits</text>

  <!-- Panel right border -->
  <line x1="280" y1="0" x2="280" y2="300" stroke="#dee2e6" stroke-width="1"/>

  <!-- Project label -->
  <text x="312" y="42" font-family="'Courier New', Courier, monospace" font-size="13" fill="#adb5bd">garage-fleet / bug story</text>

  <!-- Post title -->
  <text x="312" y="82" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="bold" fill="#0d2137">One Mount Option Away</text>
  <text x="312" y="118" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="bold" fill="#0d2137">From an Unbootable Server</text>

  <!-- Tagline -->
  <text x="315" y="150" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#495057">How noauto silently killed the ZFS pool import</text>

  <!-- Separator -->
  <line x1="312" y1="168" x2="775" y2="168" stroke="#e9ecef" stroke-width="1.5"/>

  <!-- Concept chips row 1 -->
  <rect x="312" y="182" width="102" height="28" fill="#fff5f5" rx="14" stroke="#ff6b6b" stroke-width="1.5"/>
  <text x="363" y="200" font-family="Arial, sans-serif" font-size="12" fill="#c92a2a" text-anchor="middle">Emergency mode</text>

  <rect x="424" y="182" width="104" height="28" fill="#e7f5ff" rx="14" stroke="#4dabf7" stroke-width="1.5"/>
  <text x="476" y="200" font-family="Arial, sans-serif" font-size="12" fill="#1971c2" text-anchor="middle">zfs-import.target</text>

  <rect x="538" y="182" width="96" height="28" fill="#fff9db" rx="14" stroke="#ffd43b" stroke-width="1.5"/>
  <text x="586" y="200" font-family="Arial, sans-serif" font-size="12" fill="#e67700" text-anchor="middle">Locked-at-boot</text>

  <rect x="644" y="182" width="76" height="28" fill="#ebfbee" rx="14" stroke="#51cf66" stroke-width="1.5"/>
  <text x="682" y="200" font-family="Arial, sans-serif" font-size="12" fill="#2f9e44" text-anchor="middle">nofail only</text>

  <!-- Concept chips row 2 -->
  <rect x="312" y="220" width="112" height="26" fill="#f8f0fc" rx="13" stroke="#cc5de8" stroke-width="1.5"/>
  <text x="368" y="237" font-family="Arial, sans-serif" font-size="12" fill="#862e9c" text-anchor="middle">nixpkgs zfs.nix read</text>

  <rect x="434" y="220" width="132" height="26" fill="#fff4e6" rx="13" stroke="#ff922b" stroke-width="1.5"/>
  <text x="500" y="237" font-family="Arial, sans-serif" font-size="12" fill="#d9480f" text-anchor="middle">"dataset does not exist"</text>

  <rect x="576" y="220" width="104" height="26" fill="#e6fcf5" rx="13" stroke="#20c997" stroke-width="1.5"/>
  <text x="628" y="237" font-family="Arial, sans-serif" font-size="12" fill="#0ca678" text-anchor="middle">wait_for_ssh race</text>

  <!-- Bottom caption -->
  <text x="312" y="278" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#adb5bd">The failed mount IS the gate working · read the module source, not the folklore</text>
</svg>
