<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300">
  <rect width="800" height="300" fill="#ffffff"/>

  <!-- Left accent panel -->
  <rect x="0" y="0" width="280" height="300" fill="#1a2744"/>

  <!-- Container box (top) -->
  <rect x="95" y="70" width="90" height="56" rx="4" fill="none" stroke="#4dabf7" stroke-width="3"/>
  <line x1="112" y1="76" x2="112" y2="120" stroke="#74c0fc" stroke-width="1.5"/>
  <line x1="129" y1="76" x2="129" y2="120" stroke="#74c0fc" stroke-width="1.5"/>
  <line x1="146" y1="76" x2="146" y2="120" stroke="#74c0fc" stroke-width="1.5"/>
  <line x1="163" y1="76" x2="163" y2="120" stroke="#74c0fc" stroke-width="1.5"/>

  <!-- Middle layer: namespaces / cgroups -->
  <rect x="70" y="145" width="140" height="34" rx="4" fill="none" stroke="#51cf66" stroke-width="2.5"/>
  <text x="140" y="167" font-family="'DejaVu Sans Mono', monospace" font-size="11" fill="#51cf66" text-anchor="middle">namespaces cgroups</text>

  <!-- Base layer: kernel -->
  <rect x="55" y="190" width="170" height="34" rx="4" fill="none" stroke="#ffd43b" stroke-width="3"/>
  <text x="140" y="212" font-family="'DejaVu Sans Mono', monospace" font-size="13" fill="#ffd43b" text-anchor="middle">linux kernel</text>

  <!-- Connector lines -->
  <line x1="140" y1="126" x2="140" y2="145" stroke="#74c0fc" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="140" y1="179" x2="140" y2="190" stroke="#51cf66" stroke-width="2" stroke-dasharray="4 3"/>

  <!-- Signal dots -->
  <circle cx="220" cy="256" r="3.5" fill="#4dabf7" opacity="0.5"/>
  <circle cx="236" cy="256" r="3.5" fill="#4dabf7" opacity="0.75"/>
  <circle cx="252" cy="256" r="3.5" fill="#4dabf7" opacity="1"/>

  <!-- Panel right border -->
  <line x1="280" y1="0" x2="280" y2="300" stroke="#dee2e6" stroke-width="1"/>

  <!-- Title -->
  <text x="312" y="95" font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="50" font-weight="bold" fill="#1a2744" letter-spacing="-1">linux first</text>

  <!-- Tagline -->
  <text x="315" y="128" font-family="'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#495057" letter-spacing="0.3">Containers are not magic — they are Linux</text>

  <!-- Separator -->
  <line x1="312" y1="148" x2="775" y2="148" stroke="#e9ecef" stroke-width="1.5"/>

  <!-- Chips row 1 -->
  <rect x="312" y="163" width="51" height="28" fill="#fff9db" rx="14" stroke="#ffd43b" stroke-width="1.5"/>
  <text x="337.5" y="181" font-family="'DejaVu Sans', sans-serif" font-size="12" fill="#e67700" text-anchor="middle">Linux</text>

  <rect x="373" y="163" width="61" height="28" fill="#e7f5ff" rx="14" stroke="#4dabf7" stroke-width="1.5"/>
  <text x="403.5" y="181" font-family="'DejaVu Sans', sans-serif" font-size="12" fill="#1971c2" text-anchor="middle">Docker</text>

  <rect x="444" y="163" width="40" height="28" fill="#ebfbee" rx="14" stroke="#51cf66" stroke-width="1.5"/>
  <text x="464" y="181" font-family="'DejaVu Sans', sans-serif" font-size="12" fill="#2f9e44" text-anchor="middle">K3s</text>

  <!-- Chips row 2 -->
  <rect x="312" y="202" width="95" height="26" fill="#ebfbee" rx="13" stroke="#51cf66" stroke-width="1.5"/>
  <text x="359.5" y="219" font-family="'DejaVu Sans', sans-serif" font-size="12" fill="#2f9e44" text-anchor="middle">Namespaces</text>

  <rect x="417" y="202" width="66" height="26" fill="#e6fcf5" rx="13" stroke="#20c997" stroke-width="1.5"/>
  <text x="450" y="219" font-family="'DejaVu Sans', sans-serif" font-size="12" fill="#0ca678" text-anchor="middle">cgroups</text>

  <rect x="493" y="202" width="68" height="26" fill="#f8f0fc" rx="13" stroke="#cc5de8" stroke-width="1.5"/>
  <text x="527" y="219" font-family="'DejaVu Sans', sans-serif" font-size="12" fill="#862e9c" text-anchor="middle">Rancher</text>

  <!-- Bottom caption -->
  <text x="312" y="272" font-family="'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#adb5bd">Processes · Namespaces · cgroups · Filesystems</text>
</svg>
