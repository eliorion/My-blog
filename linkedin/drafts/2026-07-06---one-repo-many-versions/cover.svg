<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300">
  <rect width="800" height="300" fill="#ffffff"/>

  <!-- Left accent panel -->
  <rect x="0" y="0" width="280" height="300" fill="#0d2137"/>

  <!-- Monorepo box -->
  <rect x="36" y="46" width="90" height="52" fill="none" stroke="#4dabf7" stroke-width="2.5" rx="6"/>
  <text x="81" y="68" font-family="'Courier New', Courier, monospace" font-size="11" fill="#4dabf7" text-anchor="middle">monorepo</text>
  <text x="81" y="86" font-family="'Courier New', Courier, monospace" font-size="9" fill="#74c0fc" text-anchor="middle">12 components</text>

  <!-- Fan-out to version tags -->
  <line x1="126" y1="60" x2="168" y2="52" stroke="#51cf66" stroke-width="2" stroke-linecap="round"/>
  <line x1="126" y1="72" x2="168" y2="92" stroke="#51cf66" stroke-width="2" stroke-linecap="round"/>
  <line x1="126" y1="84" x2="168" y2="132" stroke="#51cf66" stroke-width="2" stroke-linecap="round"/>

  <!-- Version tags at different versions -->
  <rect x="172" y="40" width="84" height="24" fill="none" stroke="#51cf66" stroke-width="2" rx="12"/>
  <text x="214" y="56" font-family="'Courier New', Courier, monospace" font-size="10" fill="#51cf66" text-anchor="middle">webapp v0.7</text>
  <rect x="172" y="80" width="84" height="24" fill="none" stroke="#51cf66" stroke-width="2" rx="12"/>
  <text x="214" y="96" font-family="'Courier New', Courier, monospace" font-size="10" fill="#51cf66" text-anchor="middle">orch v0.8</text>
  <rect x="169.5" y="120" width="89" height="24" fill="none" stroke="#51cf66" stroke-width="2" rx="12"/>
  <text x="214" y="136" font-family="'Courier New', Courier, monospace" font-size="10" fill="#51cf66" text-anchor="middle">engine v0.1.1</text>

  <!-- The trap: frozen pin -->
  <rect x="36" y="170" width="220" height="34" fill="none" stroke="#ff6b6b" stroke-width="2.5" rx="6"/>
  <text x="146" y="192" font-family="'Courier New', Courier, monospace" font-size="11" fill="#ff6b6b" text-anchor="middle">release-as: 0.1.0  # stale</text>

  <!-- Loop arrow showing no-op -->
  <path d="M 66 210 C 46 236, 96 252, 116 232" stroke="#ffd43b" stroke-width="2" fill="none" stroke-linecap="round" stroke-dasharray="4,3"/>
  <polygon points="110,228 120,236 120,224" fill="#ffd43b"/>
  <text x="170" y="240" font-family="'Courier New', Courier, monospace" font-size="10" fill="#ffd43b" text-anchor="middle">v0.1.0 → v0.1.0</text>

  <text x="146" y="272" font-family="Arial, sans-serif" font-size="11" fill="#adb5bd" text-anchor="middle">one-shot config, never removed</text>

  <!-- Panel right border -->
  <line x1="280" y1="0" x2="280" y2="300" stroke="#dee2e6" stroke-width="1"/>

  <!-- Project label -->
  <text x="312" y="42" font-family="'Courier New', Courier, monospace" font-size="13" fill="#adb5bd">asp / release engineering</text>

  <!-- Post title -->
  <text x="312" y="82" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="bold" fill="#0d2137">One Repo, Many Versions:</text>
  <text x="312" y="118" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="bold" fill="#0d2137">Living with release-please</text>

  <!-- Tagline -->
  <text x="315" y="150" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#495057">Per-component releases, and the two ways they broke</text>

  <!-- Separator -->
  <line x1="312" y1="168" x2="775" y2="168" stroke="#e9ecef" stroke-width="1.5"/>

  <!-- Concept chips row 1 -->
  <rect x="312" y="182" width="139" height="28" fill="#e7f5ff" rx="14" stroke="#4dabf7" stroke-width="1.5"/>
  <text x="381.5" y="200" font-family="Arial, sans-serif" font-size="12" fill="#1971c2" text-anchor="middle">Per-component tags</text>

  <rect x="461" y="182" width="108" height="28" fill="#ebfbee" rx="14" stroke="#51cf66" stroke-width="1.5"/>
  <text x="515" y="200" font-family="Arial, sans-serif" font-size="12" fill="#2f9e44" text-anchor="middle">uv.lock re-sync</text>

  <rect x="579" y="182" width="109" height="28" fill="#fff5f5" rx="14" stroke="#ff6b6b" stroke-width="1.5"/>
  <text x="633.5" y="200" font-family="Arial, sans-serif" font-size="12" fill="#c92a2a" text-anchor="middle">release-as trap</text>

  <rect x="698" y="182" width="72" height="28" fill="#fff9db" rx="14" stroke="#ffd43b" stroke-width="1.5"/>
  <text x="734" y="200" font-family="Arial, sans-serif" font-size="12" fill="#e67700" text-anchor="middle">PAT push</text>

  <!-- Concept chips row 2 -->
  <rect x="312" y="220" width="131" height="26" fill="#e6fcf5" rx="13" stroke="#20c997" stroke-width="1.5"/>
  <text x="377.5" y="237" font-family="Arial, sans-serif" font-size="10" fill="#0ca678" text-anchor="middle">Conventional commits</text>

  <rect x="453" y="220" width="100" height="26" fill="#fff4e6" rx="13" stroke="#ff922b" stroke-width="1.5"/>
  <text x="503" y="237" font-family="Arial, sans-serif" font-size="10" fill="#d9480f" text-anchor="middle">tag_name exists</text>

  <rect x="563" y="220" width="95" height="26" fill="#f8f0fc" rx="13" stroke="#cc5de8" stroke-width="1.5"/>
  <text x="610.5" y="237" font-family="Arial, sans-serif" font-size="10" fill="#862e9c" text-anchor="middle">bump-chart job</text>

  <rect x="668" y="220" width="94" height="26" fill="#e7f5ff" rx="13" stroke="#74c0fc" stroke-width="1.5"/>
  <text x="715" y="237" font-family="Arial, sans-serif" font-size="10" fill="#1971c2" text-anchor="middle">Release ledger</text>

  <!-- Bottom caption -->
  <text x="312" y="262" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#adb5bd"><tspan x="312">Regenerate what the bump invalidates · remove one-shot config in the</tspan><tspan x="312" dy="16">same motion</tspan></text>
</svg>
