<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300">
  <rect width="800" height="300" fill="#ffffff"/>

  <!-- Left accent panel -->
  <rect x="0" y="0" width="280" height="300" fill="#1a2744"/>

  <!-- Snake curve (python) -->
  <path d="M 70,95 C 100,58 140,122 180,85" fill="none" stroke="#51cf66" stroke-width="4" stroke-linecap="round"/>
  <circle cx="183" cy="83" r="6.5" fill="#51cf66"/>

  <!-- Shipping container -->
  <rect x="60" y="130" width="160" height="75" rx="4" fill="none" stroke="#4dabf7" stroke-width="3"/>
  <line x1="80" y1="136" x2="80" y2="199" stroke="#74c0fc" stroke-width="1.5"/>
  <line x1="100" y1="136" x2="100" y2="199" stroke="#74c0fc" stroke-width="1.5"/>
  <line x1="180" y1="136" x2="180" y2="199" stroke="#74c0fc" stroke-width="1.5"/>
  <line x1="200" y1="136" x2="200" y2="199" stroke="#74c0fc" stroke-width="1.5"/>
  <!-- Label plate -->
  <rect x="110" y="150" width="60" height="34" rx="4" fill="#1a2744" stroke="#ffd43b" stroke-width="2.5"/>
  <text x="140" y="173" font-family="'DejaVu Sans Mono', monospace" font-size="20" font-weight="bold" fill="#ffd43b" text-anchor="middle">.py</text>

  <!-- Commit ticks below (conventional commits) -->
  <circle cx="75" cy="235" r="4" fill="#ff922b"/>
  <line x1="83" y1="235" x2="110" y2="235" stroke="#ff922b" stroke-width="2"/>
  <circle cx="118" cy="235" r="4" fill="#ff922b"/>
  <line x1="126" y1="235" x2="153" y2="235" stroke="#ff922b" stroke-width="2"/>
  <circle cx="161" cy="235" r="4" fill="#ff922b"/>

  <!-- Signal dots (top right) -->
  <circle cx="228" cy="60" r="3.5" fill="#4dabf7" opacity="0.5"/>
  <circle cx="244" cy="60" r="3.5" fill="#4dabf7" opacity="0.75"/>
  <circle cx="260" cy="60" r="3.5" fill="#4dabf7" opacity="1"/>

  <!-- Panel right border -->
  <line x1="280" y1="0" x2="280" y2="300" stroke="#dee2e6" stroke-width="1"/>

  <!-- Title -->
  <text x="312" y="95" font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="42" font-weight="bold" fill="#1a2744" letter-spacing="-1">python, shipped</text>

  <!-- Tagline -->
  <text x="315" y="128" font-family="'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#495057" letter-spacing="0.3">A Python app containerised from scratch</text>

  <!-- Separator -->
  <line x1="312" y1="148" x2="775" y2="148" stroke="#e9ecef" stroke-width="1.5"/>

  <!-- Chips row 1 -->
  <rect x="312" y="163" width="66" height="28" fill="#fff9db" rx="14" stroke="#ffd43b" stroke-width="1.5"/>
  <text x="345" y="181" font-family="'DejaVu Sans', sans-serif" font-size="12" fill="#e67700" text-anchor="middle">Python</text>

  <rect x="388" y="163" width="66" height="28" fill="#e7f5ff" rx="14" stroke="#4dabf7" stroke-width="1.5"/>
  <text x="421" y="181" font-family="'DejaVu Sans', sans-serif" font-size="12" fill="#1971c2" text-anchor="middle">Docker</text>

  <rect x="464" y="163" width="46" height="28" fill="#fff4e6" rx="14" stroke="#ff922b" stroke-width="1.5"/>
  <text x="487" y="181" font-family="'DejaVu Sans', sans-serif" font-size="12" fill="#d9480f" text-anchor="middle">Git</text>

  <!-- Chips row 2 -->
  <rect x="312" y="202" width="86" height="26" fill="#ebfbee" rx="13" stroke="#51cf66" stroke-width="1.5"/>
  <text x="355" y="219" font-family="'DejaVu Sans', sans-serif" font-size="12" fill="#2f9e44" text-anchor="middle">DevSecOps</text>

  <rect x="408" y="202" width="93" height="26" fill="#f8f0fc" rx="13" stroke="#cc5de8" stroke-width="1.5"/>
  <text x="454" y="219" font-family="'DejaVu Sans', sans-serif" font-size="12" fill="#862e9c" text-anchor="middle">Commitizen</text>

  <rect x="511" y="202" width="46" height="26" fill="#e6fcf5" rx="13" stroke="#20c997" stroke-width="1.5"/>
  <text x="534" y="219" font-family="'DejaVu Sans', sans-serif" font-size="12" fill="#0ca678" text-anchor="middle">CI</text>

  <!-- Bottom caption -->
  <text x="312" y="272" font-family="'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#adb5bd">Multi-stage builds · Conventional commits · Security scans</text>
</svg>
