<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300">
  <rect width="800" height="300" fill="#ffffff"/>

  <!-- Left accent panel -->
  <rect x="0" y="0" width="280" height="300" fill="#0d2137"/>

  <!-- Onsite node A -->
  <rect x="38" y="48" width="70" height="40" fill="none" stroke="#4dabf7" stroke-width="2.5" rx="6"/>
  <circle cx="50" cy="60" r="3" fill="#51cf66"/>
  <text x="73" y="73" font-family="'Courier New', Courier, monospace" font-size="11" fill="#4dabf7" text-anchor="middle">node-A</text>

  <!-- Offsite node B -->
  <rect x="172" y="48" width="70" height="40" fill="none" stroke="#51cf66" stroke-width="2.5" rx="6"/>
  <circle cx="184" cy="60" r="3" fill="#51cf66"/>
  <text x="207" y="73" font-family="'Courier New', Courier, monospace" font-size="11" fill="#51cf66" text-anchor="middle">node-B</text>

  <!-- Offsite node C -->
  <rect x="172" y="130" width="70" height="40" fill="none" stroke="#51cf66" stroke-width="2.5" rx="6"/>
  <circle cx="184" cy="142" r="3" fill="#51cf66"/>
  <text x="207" y="155" font-family="'Courier New', Courier, monospace" font-size="11" fill="#51cf66" text-anchor="middle">node-C</text>

  <!-- Gateway node D -->
  <rect x="38" y="130" width="70" height="40" fill="none" stroke="#ffd43b" stroke-width="2.5" rx="6"/>
  <text x="73" y="155" font-family="'Courier New', Courier, monospace" font-size="11" fill="#ffd43b" text-anchor="middle">node-D</text>

  <!-- Mesh lines -->
  <line x1="108" y1="68" x2="172" y2="68" stroke="#74c0fc" stroke-width="1.8" stroke-dasharray="4,3"/>
  <line x1="108" y1="150" x2="172" y2="150" stroke="#74c0fc" stroke-width="1.8" stroke-dasharray="4,3"/>
  <line x1="73" y1="88" x2="73" y2="130" stroke="#74c0fc" stroke-width="1.8" stroke-dasharray="4,3"/>
  <line x1="207" y1="88" x2="207" y2="130" stroke="#74c0fc" stroke-width="1.8" stroke-dasharray="4,3"/>
  <line x1="108" y1="88" x2="172" y2="130" stroke="#74c0fc" stroke-width="1.4" stroke-dasharray="4,3"/>
  <line x1="172" y1="88" x2="108" y2="130" stroke="#74c0fc" stroke-width="1.4" stroke-dasharray="4,3"/>

  <!-- Moat arc under storage nodes -->
  <path d="M 30 210 Q 140 240 250 210" fill="none" stroke="#20c997" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 40 224 Q 140 252 240 224" fill="none" stroke="#20c997" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="5,4"/>
  <text x="140" y="270" font-family="'Courier New', Courier, monospace" font-size="12" fill="#20c997" text-anchor="middle">zfs snapshot moat</text>

  <!-- Panel right border -->
  <line x1="280" y1="0" x2="280" y2="300" stroke="#dee2e6" stroke-width="1"/>

  <!-- Project label -->
  <text x="312" y="42" font-family="'Courier New', Courier, monospace" font-size="13" fill="#adb5bd">garage-fleet / overview</text>

  <!-- Post title -->
  <text x="312" y="82" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="bold" fill="#0d2137">A Ransomware-Resistant</text>
  <text x="312" y="118" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="bold" fill="#0d2137">Backup Fleet on NixOS</text>

  <!-- Tagline -->
  <text x="315" y="150" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#495057">Backups production cannot destroy</text>

  <!-- Separator -->
  <line x1="312" y1="168" x2="775" y2="168" stroke="#e9ecef" stroke-width="1.5"/>

  <!-- Concept chips row 1 -->
  <rect x="312" y="182" width="76" height="28" fill="#e7f5ff" rx="14" stroke="#4dabf7" stroke-width="1.5"/>
  <text x="350" y="200" font-family="Arial, sans-serif" font-size="11" fill="#1971c2" text-anchor="middle">Garage S3</text>

  <rect x="398" y="182" width="89" height="28" fill="#ebfbee" rx="14" stroke="#51cf66" stroke-width="1.5"/>
  <text x="442.5" y="200" font-family="Arial, sans-serif" font-size="11" fill="#2f9e44" text-anchor="middle">NixOS + ZFS</text>

  <rect x="497" y="182" width="142" height="28" fill="#fff9db" rx="14" stroke="#ffd43b" stroke-width="1.5"/>
  <text x="568" y="200" font-family="Arial, sans-serif" font-size="11" fill="#e67700" text-anchor="middle">Separate trust domain</text>

  <rect x="649" y="182" width="104" height="28" fill="#f8f0fc" rx="14" stroke="#cc5de8" stroke-width="1.5"/>
  <text x="701" y="200" font-family="Arial, sans-serif" font-size="11" fill="#862e9c" text-anchor="middle">Geo-distributed</text>

  <!-- Concept chips row 2 -->
  <rect x="312" y="220" width="108" height="26" fill="#e6fcf5" rx="13" stroke="#20c997" stroke-width="1.5"/>
  <text x="366" y="237" font-family="Arial, sans-serif" font-size="11" fill="#0ca678" text-anchor="middle">Sanoid RO moat</text>

  <rect x="430" y="220" width="112" height="26" fill="#fff5f5" rx="13" stroke="#ff6b6b" stroke-width="1.5"/>
  <text x="486" y="237" font-family="Arial, sans-serif" font-size="11" fill="#c92a2a" text-anchor="middle">4 nodes, 3 zones</text>

  <rect x="552" y="220" width="83" height="26" fill="#fff4e6" rx="13" stroke="#ff922b" stroke-width="1.5"/>
  <text x="593.5" y="237" font-family="Arial, sans-serif" font-size="11" fill="#d9480f" text-anchor="middle">Tailnet-only</text>

  <rect x="645" y="220" width="113" height="26" fill="#e7f5ff" rx="13" stroke="#74c0fc" stroke-width="1.5"/>
  <text x="701.5" y="237" font-family="Arial, sans-serif" font-size="11" fill="#1971c2" text-anchor="middle">DR for prod Talos</text>

  <!-- Bottom caption -->
  <text x="312" y="262" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#adb5bd"><tspan x="312">Name the attacker first · etcd, CNPG PITR, Longhorn PVCs land here</tspan><tspan x="312" dy="16">and stay here</tspan></text>
</svg>
