<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300">
  <rect width="800" height="300" fill="#ffffff"/>

  <!-- Left accent panel -->
  <rect x="0" y="0" width="280" height="300" fill="#1a2744"/>

  <!-- Server rack -->
  <rect x="85" y="50" width="110" height="185" rx="4" fill="none" stroke="#51cf66" stroke-width="3"/>
  <line x1="85" y1="112" x2="195" y2="112" stroke="#51cf66" stroke-width="2"/>
  <line x1="85" y1="174" x2="195" y2="174" stroke="#51cf66" stroke-width="2"/>
  <!-- Unit 1 -->
  <circle cx="100" cy="81" r="3.5" fill="#ffd43b"/>
  <circle cx="112" cy="81" r="3.5" fill="#4dabf7"/>
  <line x1="130" y1="73" x2="182" y2="73" stroke="#4dabf7" stroke-width="1.5"/>
  <line x1="130" y1="81" x2="182" y2="81" stroke="#4dabf7" stroke-width="1.5"/>
  <line x1="130" y1="89" x2="182" y2="89" stroke="#4dabf7" stroke-width="1.5"/>
  <!-- Unit 2 -->
  <circle cx="100" cy="143" r="3.5" fill="#ffd43b"/>
  <circle cx="112" cy="143" r="3.5" fill="#4dabf7"/>
  <line x1="130" y1="135" x2="182" y2="135" stroke="#4dabf7" stroke-width="1.5"/>
  <line x1="130" y1="143" x2="182" y2="143" stroke="#4dabf7" stroke-width="1.5"/>
  <line x1="130" y1="151" x2="182" y2="151" stroke="#4dabf7" stroke-width="1.5"/>
  <!-- Unit 3 -->
  <circle cx="100" cy="205" r="3.5" fill="#51cf66"/>
  <circle cx="112" cy="205" r="3.5" fill="#4dabf7"/>
  <line x1="130" y1="197" x2="182" y2="197" stroke="#4dabf7" stroke-width="1.5"/>
  <line x1="130" y1="205" x2="182" y2="205" stroke="#4dabf7" stroke-width="1.5"/>
  <line x1="130" y1="213" x2="182" y2="213" stroke="#4dabf7" stroke-width="1.5"/>

  <!-- K8s-style hexagon (top right) -->
  <polygon points="230,53 249,64 249,86 230,97 211,86 211,64" fill="none" stroke="#4dabf7" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="230" cy="75" r="7" fill="none" stroke="#74c0fc" stroke-width="2"/>

  <!-- Signal dots -->
  <circle cx="220" cy="248" r="3.5" fill="#4dabf7" opacity="0.5"/>
  <circle cx="236" cy="248" r="3.5" fill="#4dabf7" opacity="0.75"/>
  <circle cx="252" cy="248" r="3.5" fill="#4dabf7" opacity="1"/>

  <!-- Panel right border -->
  <line x1="280" y1="0" x2="280" y2="300" stroke="#dee2e6" stroke-width="1"/>

  <!-- Title -->
  <text x="312" y="95" font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="50" font-weight="bold" fill="#1a2744" letter-spacing="-1">first steps</text>

  <!-- Tagline -->
  <text x="315" y="128" font-family="'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#495057" letter-spacing="0.3">From bare metal to my first Kubernetes cluster</text>

  <!-- Separator -->
  <line x1="312" y1="148" x2="775" y2="148" stroke="#e9ecef" stroke-width="1.5"/>

  <!-- Chips row 1 -->
  <rect x="312" y="163" width="73" height="28" fill="#fff4e6" rx="14" stroke="#ff922b" stroke-width="1.5"/>
  <text x="348" y="181" font-family="'DejaVu Sans', sans-serif" font-size="12" fill="#d9480f" text-anchor="middle">Proxmox</text>

  <rect x="395" y="163" width="100" height="28" fill="#e7f5ff" rx="14" stroke="#4dabf7" stroke-width="1.5"/>
  <text x="445" y="181" font-family="'DejaVu Sans', sans-serif" font-size="12" fill="#1971c2" text-anchor="middle">Talos Linux</text>

  <rect x="505" y="163" width="46" height="28" fill="#ebfbee" rx="14" stroke="#51cf66" stroke-width="1.5"/>
  <text x="528" y="181" font-family="'DejaVu Sans', sans-serif" font-size="12" fill="#2f9e44" text-anchor="middle">K8s</text>

  <!-- Chips row 2 -->
  <rect x="312" y="202" width="46" height="26" fill="#ebfbee" rx="13" stroke="#51cf66" stroke-width="1.5"/>
  <text x="335" y="219" font-family="'DejaVu Sans', sans-serif" font-size="12" fill="#2f9e44" text-anchor="middle">K3s</text>

  <rect x="368" y="202" width="80" height="26" fill="#e7f5ff" rx="13" stroke="#74c0fc" stroke-width="1.5"/>
  <text x="408" y="219" font-family="'DejaVu Sans', sans-serif" font-size="12" fill="#1971c2" text-anchor="middle">talosctl</text>

  <rect x="458" y="202" width="80" height="26" fill="#fff9db" rx="13" stroke="#ffd43b" stroke-width="1.5"/>
  <text x="498" y="219" font-family="'DejaVu Sans', sans-serif" font-size="12" fill="#e67700" text-anchor="middle">Hardware</text>

  <!-- Bottom caption -->
  <text x="312" y="272" font-family="'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#adb5bd">Proxmox VE · Talos Linux · Kubernetes on bare metal</text>
</svg>
