<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300">
  <rect width="800" height="300" fill="#ffffff"/>

  <!-- Left accent panel -->
  <rect x="0" y="0" width="280" height="300" fill="#1a1035"/>

  <!-- Old key icon (top left) -->
  <!-- Key shaft -->
  <line x1="30" y1="72" x2="82" y2="72" stroke="#6c757d" stroke-width="3" stroke-linecap="round"/>
  <!-- Key teeth -->
  <line x1="54" y1="72" x2="54" y2="84" stroke="#6c757d" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="64" y1="72" x2="64" y2="80" stroke="#6c757d" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="74" y1="72" x2="74" y2="84" stroke="#6c757d" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Key head -->
  <circle cx="22" cy="72" r="11" fill="none" stroke="#6c757d" stroke-width="3"/>
  <circle cx="22" cy="72" r="4" fill="none" stroke="#6c757d" stroke-width="2"/>
  <!-- "OLD" label -->
  <text x="44" y="100" font-family="'Courier New', Courier, monospace" font-size="9" fill="#6c757d" text-anchor="middle">age1old...abc</text>
  <!-- Strike-through -->
  <line x1="16" y1="61" x2="82" y2="87" stroke="#ff6b6b" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Arrow down: old → compare -->
  <line x1="50" y1="108" x2="50" y2="128" stroke="#495057" stroke-width="2" stroke-dasharray="3,2"/>
  <polygon points="44,126 50,138 56,126" fill="#495057"/>

  <!-- Compare box -->
  <rect x="18" y="138" width="102" height="36" fill="#1a1035" rx="6" stroke="#ffd43b" stroke-width="2"/>
  <text x="69" y="154" font-family="'Courier New', Courier, monospace" font-size="9" fill="#ffd43b" text-anchor="middle">SHA compare</text>
  <text x="69" y="167" font-family="Arial, sans-serif" font-size="8" fill="#868e96" text-anchor="middle">server vs CI secret</text>

  <!-- Mismatch indicator -->
  <text x="140" y="160" font-family="Arial, sans-serif" font-size="20" fill="#ff6b6b" font-weight="bold">≠</text>

  <!-- Arrow down: compare → rotate -->
  <line x1="69" y1="174" x2="69" y2="193" stroke="#ff6b6b" stroke-width="2" stroke-dasharray="3,2"/>
  <polygon points="63,191 69,203 75,191" fill="#ff6b6b"/>

  <!-- Rotate action box -->
  <rect x="18" y="203" width="102" height="34" fill="#2a0a0a" rx="6" stroke="#ff6b6b" stroke-width="2"/>
  <text x="69" y="217" font-family="'Courier New', Courier, monospace" font-size="9" fill="#ff6b6b" text-anchor="middle">sops updatekeys</text>
  <text x="69" y="230" font-family="Arial, sans-serif" font-size="8" fill="#868e96" text-anchor="middle">all .enc files</text>

  <!-- New key icon (bottom) -->
  <line x1="168" y1="228" x2="220" y2="228" stroke="#51cf66" stroke-width="3" stroke-linecap="round"/>
  <line x1="192" y1="228" x2="192" y2="240" stroke="#51cf66" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="202" y1="228" x2="202" y2="236" stroke="#51cf66" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="212" y1="228" x2="212" y2="240" stroke="#51cf66" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="160" cy="228" r="11" fill="none" stroke="#51cf66" stroke-width="3"/>
  <circle cx="160" cy="228" r="4" fill="none" stroke="#51cf66" stroke-width="2"/>
  <text x="190" y="254" font-family="'Courier New', Courier, monospace" font-size="9" fill="#51cf66" text-anchor="middle">age1new...xyz</text>

  <!-- Git commit badge -->
  <rect x="148" y="168" width="112" height="22" fill="#0d1117" rx="5" stroke="#4dabf7" stroke-width="1.5"/>
  <text x="204" y="183" font-family="'Courier New', Courier, monospace" font-size="9" fill="#4dabf7" text-anchor="middle">git commit [skip ci]</text>

  <!-- Match path (green check — no rotation) -->
  <text x="155" y="122" font-family="Arial, sans-serif" font-size="9" fill="#51cf66">= match</text>
  <text x="155" y="134" font-family="Arial, sans-serif" font-size="9" fill="#51cf66">→ skip</text>

  <!-- Panel right border -->
  <line x1="280" y1="0" x2="280" y2="300" stroke="#dee2e6" stroke-width="1"/>

  <!-- Project label -->
  <text x="312" y="42" font-family="'Courier New', Courier, monospace" font-size="13" fill="#adb5bd">mve-itguard / series 6</text>

  <!-- Post title -->
  <text x="312" y="82" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="#1a1035">Automated AGE</text>
  <text x="312" y="116" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="#1a1035">Key Rotation in CI</text>

  <!-- Tagline -->
  <text x="315" y="148" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#495057">Detect mismatch · re-encrypt all files · commit and deploy</text>

  <!-- Separator -->
  <line x1="312" y1="166" x2="775" y2="166" stroke="#e9ecef" stroke-width="1.5"/>

  <!-- Chips row 1 -->
  <rect x="312" y="180" width="104" height="28" fill="#fff9db" rx="14" stroke="#ffd43b" stroke-width="1.5"/>
  <text x="364" y="198" font-family="Arial, sans-serif" font-size="12" fill="#e67700" text-anchor="middle">Hash compare</text>

  <rect x="426" y="180" width="108" height="28" fill="#fff5f5" rx="14" stroke="#ff6b6b" stroke-width="1.5"/>
  <text x="480" y="198" font-family="Arial, sans-serif" font-size="12" fill="#c92a2a" text-anchor="middle">sops updatekeys</text>

  <rect x="544" y="180" width="96" height="28" fill="#e7f5ff" rx="14" stroke="#4dabf7" stroke-width="1.5"/>
  <text x="592" y="198" font-family="Arial, sans-serif" font-size="12" fill="#1971c2" text-anchor="middle">Auto-commit</text>

  <rect x="650" y="180" width="82" height="28" fill="#ebfbee" rx="14" stroke="#51cf66" stroke-width="1.5"/>
  <text x="691" y="198" font-family="Arial, sans-serif" font-size="12" fill="#2f9e44" text-anchor="middle">[skip ci]</text>

  <!-- Chips row 2 -->
  <rect x="312" y="218" width="100" height="26" fill="#f8f0fc" rx="13" stroke="#cc5de8" stroke-width="1.5"/>
  <text x="362" y="235" font-family="Arial, sans-serif" font-size="12" fill="#862e9c" text-anchor="middle">runner-rotate</text>

  <rect x="422" y="218" width="106" height="26" fill="#e6fcf5" rx="13" stroke="#20c997" stroke-width="1.5"/>
  <text x="475" y="235" font-family="Arial, sans-serif" font-size="12" fill="#0ca678" text-anchor="middle">No secrets logged</text>

  <rect x="538" y="218" width="90" height="26" fill="#fff4e6" rx="13" stroke="#ff922b" stroke-width="1.5"/>
  <text x="583" y="235" font-family="Arial, sans-serif" font-size="12" fill="#d9480f" text-anchor="middle">Trap cleanup</text>

  <rect x="638" y="218" width="118" height="26" fill="#e7f5ff" rx="13" stroke="#74c0fc" stroke-width="1.5"/>
  <text x="697" y="235" font-family="Arial, sans-serif" font-size="12" fill="#1971c2" text-anchor="middle">keys.txt.enc refresh</text>

  <!-- Bottom caption -->
  <text x="312" y="278" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#adb5bd">Two steps for dev · pipeline handles the rest · rotation actually happens</text>
</svg>
