<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300">
  <rect width="800" height="300" fill="#ffffff"/>

  <!-- Left accent panel -->
  <rect x="0" y="0" width="280" height="300" fill="#1a2744"/>

  <!-- Git commit graph -->
  <line x1="70" y1="60" x2="70" y2="210" stroke="#ff922b" stroke-width="2.5"/>
  <path d="M 70,80 C 112,80 112,140 70,140" fill="none" stroke="#cc5de8" stroke-width="2.5"/>
  <circle cx="70" cy="80" r="7" fill="#1a2744" stroke="#ff922b" stroke-width="2.5"/>
  <circle cx="101" cy="110" r="7" fill="#1a2744" stroke="#cc5de8" stroke-width="2.5"/>
  <circle cx="70" cy="140" r="7" fill="#1a2744" stroke="#ff922b" stroke-width="2.5"/>
  <circle cx="70" cy="195" r="7" fill="#1a2744" stroke="#ff922b" stroke-width="2.5"/>

  <!-- Arrow to cluster -->
  <line x1="86" y1="195" x2="138" y2="167" stroke="#51cf66" stroke-width="2.5"/>
  <polygon points="134,160 148,162 140,174" fill="#51cf66"/>

  <!-- Cluster hexagon -->
  <polygon points="190,92 224,112 224,152 190,172 156,152 156,112" fill="none" stroke="#4dabf7" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="177" cy="122" r="6" fill="#74c0fc"/>
  <circle cx="204" cy="122" r="6" fill="#74c0fc"/>
  <circle cx="190" cy="148" r="6" fill="#74c0fc"/>

  <!-- Sync arcs above hexagon -->
  <path d="M 172,70 A 22 22 0 0 1 208,70" fill="none" stroke="#51cf66" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="205,63 214,73 202,76" fill="#51cf66"/>

  <!-- Signal dots -->
  <circle cx="220" cy="248" r="3.5" fill="#4dabf7" opacity="0.5"/>
  <circle cx="236" cy="248" r="3.5" fill="#4dabf7" opacity="0.75"/>
  <circle cx="252" cy="248" r="3.5" fill="#4dabf7" opacity="1"/>

  <!-- Panel right border -->
  <line x1="280" y1="0" x2="280" y2="300" stroke="#dee2e6" stroke-width="1"/>

  <!-- Title -->
  <text x="312" y="95" font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="50" font-weight="bold" fill="#1a2744" letter-spacing="-1">gitops v1</text>

  <!-- Tagline -->
  <text x="315" y="128" font-family="'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#495057" letter-spacing="0.3">From git push to a live K3s cluster</text>

  <!-- Separator -->
  <line x1="312" y1="148" x2="775" y2="148" stroke="#e9ecef" stroke-width="1.5"/>

  <!-- Chips row 1 -->
  <rect x="312" y="163" width="40" height="28" fill="#ebfbee" rx="14" stroke="#51cf66" stroke-width="1.5"/>
  <text x="332" y="181" font-family="'DejaVu Sans', sans-serif" font-size="12" fill="#2f9e44" text-anchor="middle">K3s</text>

  <rect x="362" y="163" width="60" height="28" fill="#f8f0fc" rx="14" stroke="#cc5de8" stroke-width="1.5"/>
  <text x="392" y="181" font-family="'DejaVu Sans', sans-serif" font-size="12" fill="#862e9c" text-anchor="middle">GitHub</text>

  <rect x="432" y="163" width="80" height="28" fill="#fff4e6" rx="14" stroke="#ff922b" stroke-width="1.5"/>
  <text x="472" y="181" font-family="'DejaVu Sans', sans-serif" font-size="12" fill="#d9480f" text-anchor="middle">Cloudflare</text>

  <!-- Chips row 2 -->
  <rect x="312" y="202" width="90" height="26" fill="#fff5f5" rx="13" stroke="#ff6b6b" stroke-width="1.5"/>
  <text x="357" y="219" font-family="'DejaVu Sans', sans-serif" font-size="12" fill="#c92a2a" text-anchor="middle">Prometheus</text>

  <rect x="412" y="202" width="67" height="26" fill="#fff9db" rx="13" stroke="#ffd43b" stroke-width="1.5"/>
  <text x="445.5" y="219" font-family="'DejaVu Sans', sans-serif" font-size="12" fill="#e67700" text-anchor="middle">Grafana</text>

  <rect x="489" y="202" width="69" height="26" fill="#e7f5ff" rx="13" stroke="#4dabf7" stroke-width="1.5"/>
  <text x="523.5" y="219" font-family="'DejaVu Sans', sans-serif" font-size="12" fill="#1971c2" text-anchor="middle">Linkding</text>

  <!-- Bottom caption -->
  <text x="312" y="272" font-family="'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#adb5bd">Single-node K3s · Cloudflare Tunnel · Monitoring stack</text>
</svg>
