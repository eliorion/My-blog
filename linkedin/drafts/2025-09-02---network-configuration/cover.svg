<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300">
  <rect width="800" height="300" fill="#ffffff"/>

  <!-- Left accent panel -->
  <rect x="0" y="0" width="280" height="300" fill="#1a2744"/>

  <!-- Links from switch to nodes -->
  <line x1="140" y1="142" x2="60" y2="60" stroke="#4dabf7" stroke-width="2" opacity="0.8"/>
  <line x1="140" y1="142" x2="220" y2="60" stroke="#4dabf7" stroke-width="2" opacity="0.8"/>
  <line x1="140" y1="142" x2="60" y2="220" stroke="#4dabf7" stroke-width="2" opacity="0.8"/>
  <line x1="140" y1="142" x2="220" y2="220" stroke="#4dabf7" stroke-width="2" opacity="0.8"/>
  <!-- Packets -->
  <circle cx="100" cy="101" r="4" fill="#51cf66"/>
  <circle cx="180" cy="181" r="4" fill="#51cf66"/>

  <!-- Central switch -->
  <rect x="100" y="125" width="80" height="34" rx="4" fill="#1a2744" stroke="#cc5de8" stroke-width="3"/>
  <rect x="110" y="143" width="9" height="9" fill="none" stroke="#cc5de8" stroke-width="1.5"/>
  <rect x="126" y="143" width="9" height="9" fill="none" stroke="#cc5de8" stroke-width="1.5"/>
  <rect x="142" y="143" width="9" height="9" fill="none" stroke="#cc5de8" stroke-width="1.5"/>
  <rect x="158" y="143" width="9" height="9" fill="none" stroke="#cc5de8" stroke-width="1.5"/>
  <circle cx="115" cy="134" r="2.5" fill="#51cf66"/>
  <circle cx="126" cy="134" r="2.5" fill="#51cf66"/>

  <!-- Nodes -->
  <circle cx="60" cy="60" r="14" fill="#1a2744" stroke="#4dabf7" stroke-width="2.5"/>
  <circle cx="220" cy="60" r="14" fill="#1a2744" stroke="#4dabf7" stroke-width="2.5"/>
  <circle cx="60" cy="220" r="14" fill="#1a2744" stroke="#4dabf7" stroke-width="2.5"/>
  <circle cx="220" cy="220" r="14" fill="#1a2744" stroke="#4dabf7" stroke-width="2.5"/>
  <circle cx="60" cy="60" r="4" fill="#74c0fc"/>
  <circle cx="220" cy="60" r="4" fill="#74c0fc"/>
  <circle cx="60" cy="220" r="4" fill="#74c0fc"/>
  <circle cx="220" cy="220" r="4" fill="#74c0fc"/>

  <!-- Signal dots -->
  <circle cx="220" cy="256" r="3.5" fill="#4dabf7" opacity="0.5"/>
  <circle cx="236" cy="256" r="3.5" fill="#4dabf7" opacity="0.75"/>
  <circle cx="252" cy="256" r="3.5" fill="#4dabf7" opacity="1"/>

  <!-- Panel right border -->
  <line x1="280" y1="0" x2="280" y2="300" stroke="#dee2e6" stroke-width="1"/>

  <!-- Title -->
  <text x="312" y="95" font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="44" font-weight="bold" fill="#1a2744" letter-spacing="-1">network config</text>

  <!-- Tagline -->
  <text x="315" y="128" font-family="'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#495057" letter-spacing="0.3">Wiring the homelab: VLANs, bridges and firewall</text>

  <!-- Separator -->
  <line x1="312" y1="148" x2="775" y2="148" stroke="#e9ecef" stroke-width="1.5"/>

  <!-- Chips row 1 -->
  <rect x="312" y="163" width="53" height="28" fill="#f8f0fc" rx="14" stroke="#cc5de8" stroke-width="1.5"/>
  <text x="338" y="181" font-family="'DejaVu Sans', sans-serif" font-size="12" fill="#862e9c" text-anchor="middle">VLAN</text>

  <rect x="375" y="163" width="73" height="28" fill="#e7f5ff" rx="14" stroke="#4dabf7" stroke-width="1.5"/>
  <text x="411" y="181" font-family="'DejaVu Sans', sans-serif" font-size="12" fill="#1971c2" text-anchor="middle">Bridges</text>

  <rect x="458" y="163" width="80" height="28" fill="#fff5f5" rx="14" stroke="#ff6b6b" stroke-width="1.5"/>
  <text x="498" y="181" font-family="'DejaVu Sans', sans-serif" font-size="12" fill="#c92a2a" text-anchor="middle">Firewall</text>

  <!-- Chips row 2 -->
  <rect x="312" y="202" width="60" height="26" fill="#e7f5ff" rx="13" stroke="#74c0fc" stroke-width="1.5"/>
  <text x="342" y="219" font-family="'DejaVu Sans', sans-serif" font-size="12" fill="#1971c2" text-anchor="middle">Talos</text>

  <rect x="382" y="202" width="73" height="26" fill="#fff4e6" rx="13" stroke="#ff922b" stroke-width="1.5"/>
  <text x="418" y="219" font-family="'DejaVu Sans', sans-serif" font-size="12" fill="#d9480f" text-anchor="middle">Proxmox</text>

  <rect x="465" y="202" width="73" height="26" fill="#ebfbee" rx="13" stroke="#51cf66" stroke-width="1.5"/>
  <text x="501" y="219" font-family="'DejaVu Sans', sans-serif" font-size="12" fill="#2f9e44" text-anchor="middle">Network</text>

  <!-- Bottom caption -->
  <text x="312" y="272" font-family="'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#adb5bd">Static IPs · VLANs · Router and switch configuration</text>
</svg>
