<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300">
  <rect width="800" height="300" fill="#ffffff"/>

  <!-- Left accent panel -->
  <rect x="0" y="0" width="280" height="300" fill="#1a2744"/>

  <!-- Shield -->
  <path d="M 90,150 L 90,90 C 90,84 140,68 140,68 C 140,68 190,84 190,90 L 190,150 C 190,182 140,205 140,205 C 140,205 90,182 90,150 Z" fill="none" stroke="#ff6b6b" stroke-width="3.5"/>

  <!-- Claw marks inside shield -->
  <path d="M 118,98 Q 126,124 129,150" fill="none" stroke="#ffd43b" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 138,93 Q 144,120 146,148" fill="none" stroke="#ffd43b" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 158,98 Q 162,124 163,150" fill="none" stroke="#ffd43b" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Mesh network below (tailscale) -->
  <line x1="91" y1="235" x2="134" y2="248" stroke="#51cf66" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="146" y1="248" x2="189" y2="236" stroke="#51cf66" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="91" y1="232" x2="189" y2="232" stroke="#51cf66" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="85" cy="233" r="6" fill="#1a2744" stroke="#51cf66" stroke-width="2"/>
  <circle cx="140" cy="249" r="6" fill="#1a2744" stroke="#51cf66" stroke-width="2"/>
  <circle cx="195" cy="233" r="6" fill="#1a2744" stroke="#51cf66" stroke-width="2"/>

  <!-- Signal dots (top right) -->
  <circle cx="228" cy="60" r="3.5" fill="#4dabf7" opacity="0.5"/>
  <circle cx="244" cy="60" r="3.5" fill="#4dabf7" opacity="0.75"/>
  <circle cx="260" cy="60" r="3.5" fill="#4dabf7" opacity="1"/>

  <!-- Panel right border -->
  <line x1="280" y1="0" x2="280" y2="300" stroke="#dee2e6" stroke-width="1"/>

  <!-- Title -->
  <text x="312" y="95" font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="50" font-weight="bold" fill="#1a2744" letter-spacing="-1">openclaw</text>

  <!-- Tagline -->
  <text x="315" y="128" font-family="'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#495057" letter-spacing="0.3">Self-hosted AI agent, private by design</text>

  <!-- Separator -->
  <line x1="312" y1="148" x2="775" y2="148" stroke="#e9ecef" stroke-width="1.5"/>

  <!-- Chips row 1 -->
  <rect x="312" y="163" width="80" height="28" fill="#fff5f5" rx="14" stroke="#ff6b6b" stroke-width="1.5"/>
  <text x="352" y="181" font-family="'DejaVu Sans', sans-serif" font-size="12" fill="#c92a2a" text-anchor="middle">OpenClaw</text>

  <rect x="402" y="163" width="70" height="28" fill="#ebfbee" rx="14" stroke="#51cf66" stroke-width="1.5"/>
  <text x="437" y="181" font-family="'DejaVu Sans', sans-serif" font-size="12" fill="#2f9e44" text-anchor="middle">Tailscale</text>

  <rect x="482" y="163" width="51" height="28" fill="#fff9db" rx="14" stroke="#ffd43b" stroke-width="1.5"/>
  <text x="507.5" y="181" font-family="'DejaVu Sans', sans-serif" font-size="12" fill="#e67700" text-anchor="middle">Linux</text>

  <!-- Chips row 2 -->
  <rect x="312" y="202" width="68" height="26" fill="#fff5f5" rx="13" stroke="#ff6b6b" stroke-width="1.5"/>
  <text x="346" y="219" font-family="'DejaVu Sans', sans-serif" font-size="12" fill="#c92a2a" text-anchor="middle">Security</text>

  <rect x="390" y="202" width="50" height="26" fill="#e6fcf5" rx="13" stroke="#20c997" stroke-width="1.5"/>
  <text x="415" y="219" font-family="'DejaVu Sans', sans-serif" font-size="12" fill="#0ca678" text-anchor="middle">Mesh</text>

  <rect x="450" y="202" width="87" height="26" fill="#e7f5ff" rx="13" stroke="#4dabf7" stroke-width="1.5"/>
  <text x="493.5" y="219" font-family="'DejaVu Sans', sans-serif" font-size="12" fill="#1971c2" text-anchor="middle">Self-Hosted</text>

  <!-- Bottom caption -->
  <text x="312" y="272" font-family="'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#adb5bd">Tailscale mesh · No public ports · Hardened gateway</text>
</svg>
