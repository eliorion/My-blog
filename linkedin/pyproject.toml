[project]
name = "linkedin-engine"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-html>=4.0",
    "ruff>=0.9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
target-version = "py313"
line-length = 120
exclude = ["drafts"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "drafts/*", "__init__.py", "conftest.py", "publish.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true
