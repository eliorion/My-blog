name: LinkedIn drip

# Scheduling moved to the homelab CronJob (k8s/linkedin-drip/): LinkedIn's WAF
# rejects image uploads from GitHub-hosted runner IPs, so a run started here
# would publish text-only. Kept as a manual fallback if the cluster is down.
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Publish next draft
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
        run: python linkedin/publish.py next

      - name: Commit publish state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add linkedin/drafts
          git diff --cached --quiet || git commit -m "chore(linkedin): mark draft as published [skip ci]"
          git push origin dev
