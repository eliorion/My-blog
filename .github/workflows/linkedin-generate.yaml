name: LinkedIn generate

on:
  push:
    branches: [dev]
    paths:
      - "blog/content/11 - Posts/**"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Claude CLI
        run: curl -fsSL https://claude.ai/install.sh | bash

      - name: Generate drafts for new posts
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          python linkedin/generate.py generate

      - name: Commit new drafts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add linkedin/drafts
          git diff --cached --quiet || git commit -m "docs(linkedin): auto-generate drafts for new posts [skip ci]"
          git push origin dev
