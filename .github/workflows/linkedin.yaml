name: LinkedIn CI/CD

on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "blog/content/11 - Posts/**"
      - "linkedin/**"
      - "!linkedin/drafts/**"
  pull_request:
    paths:
      - "linkedin/**"
      - "!linkedin/drafts/**"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  checks: write

jobs:
  static:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install UV
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install
        working-directory: linkedin/

      - name: Install dependencies
        run: uv sync --locked --dev
        working-directory: linkedin/

      - name: Lint with Ruff
        run: |
          uv run ruff check --output-format=github --target-version=py313 . --exclude drafts
          uv run ruff format --diff --check --target-version=py313 . --exclude drafts
        working-directory: linkedin/

      - name: Type check
        run: uv run mypy generate.py --ignore-missing-imports
        working-directory: linkedin/

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install UV
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install
        working-directory: linkedin/

      - name: Install dependencies
        run: uv sync --locked --dev
        working-directory: linkedin/

      - name: Run tests with coverage
        run: |
          uv run pytest tests/ -v \
            --cov=. \
            --cov-report=xml:coverage.xml \
            --cov-report=html:coverage-html \
            --cov-fail-under=79 \
            --html=test-report.html \
            --self-contained-html \
            --junitxml=junit.xml
        working-directory: linkedin/

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linkedin-coverage
          path: linkedin/coverage-html/
          retention-days: 7

      - name: Upload test report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linkedin-test-report
          path: linkedin/test-report.html
          retention-days: 7

      - name: Coverage summary
        uses: irongut/CodeCoverageSummary@v1.3.0
        if: always()
        with:
          filename: linkedin/coverage.xml
          badge: true
          format: markdown
          output: both

      - name: Add coverage PR comment
        uses: marocchino/sticky-pull-request-comment@v2
        if: github.event_name == 'pull_request'
        with:
          header: linkedin-coverage
          recreate: true
          path: code-coverage-results.md

      - name: Add test results PR comment
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: github.event_name == 'pull_request'
        with:
          files: linkedin/junit.xml
          comment_title: "LinkedIn engine — test results"
