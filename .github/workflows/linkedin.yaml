name: Generate LinkedIn drafts

on:
  push:
    branches: [main]
    paths:
      - "blog/content/11 - Posts/**"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  static:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install tools
        run: pip install ruff mypy anthropic

      - name: Lint
        run: ruff check linkedin/ --exclude linkedin/drafts

      - name: Format check
        run: ruff format --check linkedin/ --exclude linkedin/drafts

      - name: Type check
        run: mypy linkedin/generate.py --ignore-missing-imports

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r linkedin/requirements.txt -r linkedin/requirements-dev.txt

      - name: Run tests
        run: |
          python -m pytest linkedin/tests/ -v \
            --cov=linkedin \
            --cov-config=linkedin/pyproject.toml \
            --cov-report=html:linkedin-coverage-html \
            --cov-report=term-missing \
            --html=linkedin-test-report.html \
            --self-contained-html

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linkedin-coverage
          path: linkedin-coverage-html/

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linkedin-test-report
          path: linkedin-test-report.html

  generate:
    name: Generate drafts
    runs-on: ubuntu-latest
    needs: [static, test]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r linkedin/requirements.txt

      - name: Generate LinkedIn posts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python linkedin/generate.py generate

      - name: Open PR with new drafts
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "feat(linkedin): generate drafts for new blog posts"
          branch: linkedin-drafts/auto
          delete-branch: true
          title: "LinkedIn drafts — new blog posts"
          body: |
            Auto-generated LinkedIn post drafts from new blog post(s).

            **Review checklist:**
            - [ ] Read each draft in `linkedin/drafts/`
            - [ ] Pick which posts to publish and in what order
            - [ ] Post on LinkedIn, then merge this PR

            Each draft folder contains:
            - `post_N.md` — LinkedIn post text with angle label in frontmatter
            - `cover.svg` — image to attach (copied from blog post)
          labels: linkedin
